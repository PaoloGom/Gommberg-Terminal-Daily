# Il collaudo del rilascio su una macchina di GitHub, solo come cancello finale: parte a ogni push sul ramo "cancello",
# che spinge solo redazione/rilascia.sh pubblica dopo i cancelli locali (G-12, leva 2: non a ogni push, per i minuti del
# repository privato; in sviluppo si collauda in locale). Lo stesso redazione/collaudo.py che si lancia a mano (kit e
# rete di non regressione), più il sito di quel commit aperto pagina per pagina in un browser vero e confrontato con
# gommberg.com. rilascia.sh porta il lavoro sul ramo principale solo se questo è verde sullo stesso commit (cancello 5).
# A mano: workflow_dispatch. Non usa token del modello né segreti. Mappa e regole: redazione/ARCHITETTURA.md.
name: Collaudo

on:
  push:
    branches: [cancello]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collaudo-${{ github.ref }}
  cancel-in-progress: true         # due push ravvicinati: conta solo l'ultimo

defaults:
  run:
    shell: bash                    # con pipefail: un errore prima di "| tee" ferma il passo

jobs:
  kit:
    name: Kit e rete di non regressione
    runs-on: ubuntu-24.04          # fisso: il testo dei PDF campione si confronta riga per riga (stessi caratteri e stesso pdftotext)
    # Tempo massimo (G-12): un job bloccato non deve bruciare minuti. Su 119 giri riusciti la mediana è 1,7 minuti e il
    # più lento 5,7 (23/11: 4,6 minuti a scaricare gli strumenti). Oggi il collaudo dura fino a 1,7 minuti e da privato
    # le macchine hanno 2 CPU invece di 4: lo stesso giorno storto farebbe da 7 a 8,5 minuti. 10 lo lascia finire.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22         # il collaudo del servizio dei lettori usa node:sqlite (Node 22.5 o più)
      - name: Strumenti del mattino (li installa prepara.sh, come ogni giorno)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils qpdf fonts-dejavu > /dev/null
          GTD_REPO="$PWD" GTD_LAVORO="$RUNNER_TEMP/avvio" bash redazione/prepara.sh | tail -4 || true
      - name: Collaudo
        run: python3 redazione/collaudo.py | tee -a "$GITHUB_STEP_SUMMARY"

  sito:
    name: Sito nel browser, contro gommberg.com
    runs-on: ubuntu-24.04
    # Tempo massimo (G-12): su 116 giri riusciti la mediana è 1,9 minuti e il più lento 7,9 (23/11: 6,5 minuti a scaricare
    # il browser). Oggi le pagine si aprono in 1,5 minuti; con 2 CPU lo stesso giorno storto farebbe da 8,5 a 10 minuti.
    # 12 lo lascia finire, e rilascia.sh pubblica aspetta questo flusso fino a 20.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser
        run: pip install --quiet playwright && python -m playwright install --with-deps chromium > /dev/null
      - name: Il sito di questo ramo, pagina per pagina
        # NO = errore vero (ferma). CAMBIA = diverso da ciò che è in linea oggi: è l'elenco di ciò che il lettore vedrà
        # cambiare con il rilascio, e va nel resoconto per Paolo.
        run: |
          python redazione/sito/costruisci.py _sito --anteprima
          python redazione/sito/collaudo_sito.py --locale _sito https://gommberg.com/ --rilascio | tee -a "$GITHUB_STEP_SUMMARY"
