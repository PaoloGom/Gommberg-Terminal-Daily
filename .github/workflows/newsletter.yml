# L'edizione via email: quando l'edizione arriva sul ramo principale, redazione/newsletter.py la passa a Kit.
# Non usa token del modello. La chiave di Kit è il segreto KIT_API_KEY e non viene mai stampata.
# Minuti di GitHub: circa 22 giri al mese di pochi secondi su ubuntu-slim = 22 minuti slim, circa 7 standard (prima 22).
name: Newsletter

on:
  push:
    branches: [main]
    paths: [edizioni.json]          # pubblica.sh lo aggiorna a ogni edizione
  workflow_dispatch:
    inputs:
      modo:
        description: "prova = bozza in Kit senza spedire; diagnosi = solo lettura; auto = come al mattino; invio-prova = spedisce subito, solo con al massimo 3 iscritti"
        type: choice
        options: [prova, diagnosi, auto, invio-prova]
        default: prova

permissions:
  contents: read

concurrency:
  group: newsletter               # mai due invii insieme: il secondo aspetta e trova il numero già partito
  cancel-in-progress: false

jobs:
  invio:
    runs-on: ubuntu-slim             # lavoro leggero (G-12): un terzo del costo di un minuto standard
    # G-69: newsletter.py ha una scadenza propria di 8 minuti per parlare con Kit (letture, rilletture, attese; la creazione
    # parte solo con almeno 30 s rimasti e non si ritenta). Oltre: nessun invio e un avviso chiaro. Qui 12 minuti sono la rete di
    # sicurezza: 8 + 30 s di creazione + circa 1 minuto di avvio e checkout, con margine.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Email dell'edizione
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          MODO: ${{ github.event.inputs.modo || 'auto' }}
        run: python3 redazione/newsletter.py "$MODO"
