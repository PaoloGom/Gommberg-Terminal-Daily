# L'edizione via email: quando l'edizione arriva sul ramo principale, redazione/newsletter.py la passa a Kit.
# Non usa token del modello. La chiave di Kit è il segreto KIT_API_KEY e non viene mai stampata.
name: Newsletter

on:
  push:
    branches: [main]
    paths: [edizioni.json]          # pubblica.sh lo aggiorna a ogni edizione
  workflow_dispatch:
    inputs:
      modo:
        description: "prova = bozza in Kit senza spedire; diagnosi = solo lettura; auto = come al mattino"
        type: choice
        options: [prova, diagnosi, auto]
        default: prova

permissions:
  contents: read

concurrency:
  group: newsletter               # mai due invii insieme: il secondo aspetta e trova il numero già partito
  cancel-in-progress: false

jobs:
  invio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Email dell'edizione
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          MODO: ${{ github.event.inputs.modo || 'auto' }}
        run: python3 redazione/newsletter.py "$MODO"
