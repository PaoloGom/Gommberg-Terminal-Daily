# Segnalazioni della Gommunity (G-13): redazione/sito/segnalazioni.py legge da gommberg.com l'elenco dei commenti che i
# lettori hanno segnalato (senza testi) e, per ogni commento nuovo, apre una segnalazione assegnata a Paolo: GitHub gli
# manda l'email. Nessun modello e nessun segreto: solo il token del giro. Se non c'è nulla non scrive a nessuno. Se
# l'avviso stesso non funziona (sito o GitHub), il giro fallisce una sola volta al giorno, al giro delle 11 di Roma, o
# subito se è lanciato a mano.
# Quando: ogni 3 ore tra le 8 e le 23 di Roma (8:15, 11:15, 14:15, 17:15, 20:15, 23:15; Paolo 23/11, G-12: non serve
# ogni ora). La sveglia la dà l'orologio di Cloudflare (G-58, redazione/sito/orologio.js: workflow_dispatch con
# orologio=cloudflare); nessuna sveglia di GitHub (passo 2 di G-58).
# Minuti di GitHub: 6 giri al giorno di circa 10 secondi su ubuntu-slim = 180 minuti slim al mese, 60 minuti standard
# (prima: ogni ora, 720 minuti standard).
name: Segnalazioni della Gommunity

on:
  workflow_dispatch:
    inputs:
      orologio:
        description: "lasciare vuoto (a mano: un guasto fa fallire subito il giro). Lo riempie l'orologio di Cloudflare"
        type: string
        default: ""

permissions:
  contents: read
  issues: write                    # la segnalazione a Paolo

defaults:
  run:
    shell: bash                    # con pipefail: se lo script esce con 1, "| tee" non lo nasconde

concurrency:
  group: segnalazioni              # mai due giri insieme: aprirebbero la stessa segnalazione due volte
  cancel-in-progress: false

jobs:
  avviso:
    runs-on: ubuntu-slim             # controllo leggero (G-12): un terzo del costo di un minuto standard
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: redazione/sito
      - name: Commenti segnalati
        env:
          GH_TOKEN: ${{ github.token }}
          A_MANO: ${{ github.event_name == 'workflow_dispatch' && !github.event.inputs.orologio }}
        run: python3 redazione/sito/segnalazioni.py | tee -a "$GITHUB_STEP_SUMMARY"
