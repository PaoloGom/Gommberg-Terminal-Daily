# Sentinella dell'orologio dei controlli (G-58, passo 2): l'unica sveglia rimasta su GitHub. Una volta al giorno legge
# gommberg.com/api/orologio (redazione/sito/orologio.py) e, se l'orologio di Cloudflare non è sano (segreto mancante o
# scaduto, GitHub che rifiuta le partenze, Worker senza codice), apre una segnalazione assegnata a Paolo: GitHub gli
# manda l'email. Una sola segnalazione aperta alla volta. Se tutto va bene non scrive a nessuno. Nessun segreto.
# Le sveglie di GitHub saltano o arrivano ore dopo: qui non importa, perché la sentinella non fa partire nessun
# controllo, guarda solo lo stato, e anche con ore di ritardo avvisa lo stesso giorno. Copre il caso "orologio fermo ed
# edizione non uscita": Paolo riceve l'avviso dell'orologio fermo.
# Minuti di GitHub: 30 giri al mese di pochi secondi su ubuntu-slim = 30 minuti slim, 10 minuti standard.
name: Sentinella dell'orologio

on:
  schedule:                        # 11:40 di Roma d'inverno, 12:40 d'estate: dopo la sveglia del mattino (10:15) e le
    - cron: "40 10 * * *"          # segnalazioni delle 11:15, quando le partenze del giorno sono già giudicabili
  workflow_dispatch:

permissions:
  contents: read
  issues: write                    # la segnalazione a Paolo

defaults:
  run:
    shell: bash                    # con pipefail: se orologio.py esce con 1, "| tee" non lo nasconde

concurrency:
  group: sentinella
  cancel-in-progress: false

jobs:
  sentinella:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: redazione/sito
      - name: Orologio dei controlli
        run: python3 redazione/sito/orologio.py | tee esito.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Segnalazione a Paolo
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Orologio dei controlli fermo"
          [ -f esito.txt ] || echo "La sentinella non è arrivata a leggere lo stato: vedi il log di GitHub Actions." > esito.txt
          N=$(gh issue list --state open --search "\"$T\" in:title" --json number -q 'length' 2>/dev/null) || N=""
          if [ "$N" = "0" ]; then
            gh issue create --title "$T" --assignee "${{ github.repository_owner }}" --body-file esito.txt \
              || echo "::warning::Segnalazione non creata: resta l'avviso di GitHub per il giro fallito."
          fi
