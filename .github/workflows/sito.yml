# gommberg.com. A ogni push su main la parte pubblica del sito va su Cloudflare (Workers, solo file statici, gratis);
# a ogni push su prova va all'anteprima prova-gommberg.<sottodominio>.workers.dev, senza statistiche.
# Cosa è pubblico lo decide redazione/sito/costruisci.py (tutto tranne la redazione); dopo la pubblicazione
# redazione/sito/collaudo.py --veloce controlla che online ci sia proprio quello. Non usa token del modello.
# Segreti del repository: CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (mai stampati). Senza, si ferma con un avviso.
name: Sito gommberg.com

on:
  push:
    branches: [main, prova]
    paths:                         # i commit che toccano solo la redazione non ripubblicano il sito
      - '**'
      - '!redazione/**'
      - 'redazione/sito/**'
      - 'redazione/**/*.json'      # il sito legge alcuni file .json della redazione (glossario, pagella...)
      - 'redazione/**/*.csv'
  workflow_dispatch:
    inputs:
      modo:
        description: "pubblica = come a ogni push; collaudo = browser vero su ogni pagina, confronto con il vecchio sito"
        type: choice
        options: [pubblica, collaudo]
        default: pubblica

permissions:
  contents: read

defaults:
  run:
    shell: bash                    # con pipefail: un errore prima di "| tee" ferma il passo

jobs:
  pubblica:
    if: github.event_name == 'push' || github.event.inputs.modo == 'pubblica'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sito-${{ github.ref }}
      cancel-in-progress: true     # due push ravvicinati: conta solo l'ultimo
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRINCIPALE: ${{ github.ref_name == 'main' }}
    steps:
      - uses: actions/checkout@v4
      - name: Parte pubblica del sito
        run: |
          if [ "$PRINCIPALE" = true ]; then python3 redazione/sito/costruisci.py _sito; else python3 redazione/sito/costruisci.py _sito --anteprima; fi | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pubblicazione su Cloudflare
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Segreti di Cloudflare non ancora impostati: niente pubblicazione su gommberg.com."
            echo "fatto=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$PRINCIPALE" = true ]; then
            npx --yes wrangler@4.165.0 deploy -c redazione/sito/wrangler.jsonc
          else
            npx --yes wrangler@4.165.0 versions upload -c redazione/sito/wrangler.jsonc --preview-alias prova
          fi
          echo "fatto=si" >> "$GITHUB_OUTPUT"
      - name: Verifica dal vivo
        if: steps.cf.outputs.fatto == 'si' && env.PRINCIPALE == 'true'
        run: python3 redazione/sito/collaudo.py https://gommberg.com/ --veloce _sito | tee -a "$GITHUB_STEP_SUMMARY"

  collaudo:
    if: github.event.inputs.modo == 'collaudo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Browser
        run: pip install --quiet playwright && python3 -m playwright install --with-deps chromium > /dev/null
      - name: Ogni pagina di gommberg.com contro il vecchio sito
        run: python3 redazione/sito/collaudo.py https://gommberg.com/ https://paologom.github.io/Gommberg-Terminal-Daily/ --pagine 40 | tee -a "$GITHUB_STEP_SUMMARY"
