# gommberg.com. A ogni push su main la parte pubblica del sito va su Cloudflare (Workers, piano gratuito: file statici
# più il servizio dei lettori, redazione/sito/lettori.js, solo per /api/*, e l'orologio dei controlli, orologio.js); a ogni push su prova o su un ramo
# anteprima-<nome> va all'anteprima <ramo>-gommberg.<sottodominio>.workers.dev (senza statistiche, noindex).
# Se la pubblicazione con il servizio dei lettori non riesce (o il database D1 non è ancora stato creato), si pubblicano
# i soli file statici: l'edizione esce sempre, la colonna dei lettori dice che la discussione non si carica.
# Cosa è pubblico lo decide redazione/sito/costruisci.py (tutto tranne la redazione); dopo la pubblicazione
# redazione/sito/collaudo_sito.py --veloce controlla che online ci sia proprio quello. Non usa token del modello.
#
# Segreti del repository (mai stampati): CLOUDFLARE_API_TOKEN, token creato con il modello "Edit Cloudflare Workers"
# (account del Gommberg, zona gommberg.com: servono Workers Scripts Edit e, per il dominio, Workers Routes Edit sulla
# zona) e CLOUDFLARE_ACCOUNT_ID. Senza segreti si ferma con un avviso, senza errore. La prima pubblicazione va fatta
# da main: prima che il Worker esista Cloudflare rifiuta l'anteprima (qui diventa un avviso). Attenzione: da qui wrangler
# non fa domande, quindi se sul dominio ci fosse già un record A/AAAA/CNAME o un altro Worker, lo sostituirebbe.
name: Sito gommberg.com

on:
  push:
    branches: [main, prova, 'anteprima-*']
    paths:                         # i commit che toccano solo la redazione non ripubblicano il sito
      - '**'
      - '!redazione/**'
      - 'redazione/sito/**'
      - 'redazione/*.json'         # costruisci.py pubblica alcuni .json della redazione (LETTI): basta che
      - 'redazione/*/*.json'       # il filtro li comprenda, qualche pubblicazione in più non costa nulla
  workflow_dispatch:
    inputs:
      modo:
        description: "pubblica = come a ogni push (solo da main, prova o anteprima-*); collaudo = browser vero su ogni pagina di gommberg.com"
        type: choice
        options: [pubblica, collaudo]
        default: pubblica

permissions:
  contents: read

defaults:
  run:
    shell: bash                    # con pipefail: un errore prima di "| tee" ferma il passo

jobs:
  pubblica:
    if: (github.event_name == 'push' || github.event.inputs.modo == 'pubblica') && (github.ref_name == 'main' || github.ref_name == 'prova' || startsWith(github.ref_name, 'anteprima-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sito-${{ github.ref }}
      cancel-in-progress: true     # due push ravvicinati: conta solo l'ultimo
    env:
      PRINCIPALE: ${{ github.ref_name == 'main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22         # wrangler 4 vuole Node 22
      - name: Parte pubblica del sito
        run: |
          if [ "$PRINCIPALE" = true ]; then python3 redazione/sito/costruisci.py _sito; else python3 redazione/sito/costruisci.py _sito --anteprima; fi | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Configurazione di riserva (soli file statici)
        # la stessa di wrangler.jsonc senza il codice dei lettori, senza il database e senza il cron dell'orologio: serve
        # se la pubblicazione completa non riesce, perché l'edizione del giorno deve arrivare comunque su gommberg.com.
        # Senza "triggers" Cloudflare lascia attivo il cron già pubblicato (lo dice la sua documentazione), che però gira
        # senza codice e non fa partire nulla: l'orologio dei controlli è fermo, /api/orologio non risponde e il controllo
        # del mattino lo segnala. Non si scrive "crons": [] di proposito: la riserva deve solo far uscire l'edizione, e un
        # cambio di cron in più è un modo in più di fallire; il cron torna con la prima pubblicazione completa.
        run: |
          python3 - <<'PY'
          import json, re
          c = json.loads(re.sub(r"^\s*//.*$", "", open("redazione/sito/wrangler.jsonc", encoding="utf-8").read(), flags=re.M))
          for k in ("main", "d1_databases", "observability", "triggers"):
              c.pop(k, None)
          for k in ("run_worker_first", "binding"):
              c["assets"].pop(k, None)
          json.dump(c, open("redazione/sito/wrangler.statico.json", "w", encoding="utf-8"), indent=1)
          PY
          if grep -q '"DA-CREARE"' redazione/sito/wrangler.jsonc; then
            echo "::notice::Database dei lettori non ancora creato (database_id DA-CREARE in wrangler.jsonc): si pubblicano i soli file statici."
            echo "CONFIG=redazione/sito/wrangler.statico.json" >> "$GITHUB_ENV"
          else
            echo "CONFIG=redazione/sito/wrangler.jsonc" >> "$GITHUB_ENV"
          fi
      - name: Pubblicazione su Cloudflare
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAMO: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Segreti di Cloudflare non ancora impostati: niente pubblicazione su gommberg.com."
            echo "fatto=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          RISERVA=redazione/sito/wrangler.statico.json
          if [ "$PRINCIPALE" = true ]; then
            # fino a 3 tentativi: dopo il passaggio la newsletter porta su gommberg.com pochi minuti dopo questo push.
            # Se con il servizio dei lettori non riesce due volte, il terzo tentativo pubblica i soli file statici.
            for N in 1 2 3; do
              C="$CONFIG"; [ "$N" = 3 ] && C="$RISERVA"
              # GITHUB_REPOSITORY: il nome del repository per l'orologio dei controlli (orologio.js), l'unico posto dove
              # sta; se il repository cambia nome (G-12), questa pubblicazione lo aggiorna da sola
              if npx --yes wrangler@4.165.0 deploy -c "$C" --var "GITHUB_REPOSITORY:$REPOSITORY"; then
                [ "$C" = "$RISERVA" ] && [ "$CONFIG" != "$RISERVA" ] && echo "::warning::Pubblicati i soli file statici: il servizio dei lettori non è in linea (vedi i tentativi sopra)."
                break
              fi
              [ "$N" = 3 ] && exit 1
              echo "::warning::Pubblicazione non riuscita (tentativo $N di 3): riprovo tra 30 secondi."; sleep 30
            done
          else
            ALIAS="$RAMO"
            prova_anteprima() {
              set +e
              OUT=$(npx --yes wrangler@4.165.0 versions upload -c "$1" --preview-alias "$ALIAS" 2>&1); RC=$?
              set -e
              echo "$OUT"
            }
            prova_anteprima "$CONFIG"
            if [ $RC -ne 0 ] && echo "$OUT" | grep -q "does not yet exist"; then
              echo "::warning::Anteprima non pubblicata: il sito su gommberg.com non è ancora mai stato pubblicato da main."
              echo "fatto=no" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ $RC -ne 0 ] && [ "$CONFIG" != "$RISERVA" ]; then
              echo "::warning::Anteprima con il servizio dei lettori non riuscita: pubblico i soli file statici."
              prova_anteprima "$RISERVA"
            fi
            [ $RC -eq 0 ] || exit $RC
            echo "Anteprima: $(echo "$OUT" | grep -o 'https://[^ ]*workers.dev' | tail -1)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "fatto=si" >> "$GITHUB_OUTPUT"
      - name: Verifica dal vivo
        if: steps.cf.outputs.fatto == 'si' && env.PRINCIPALE == 'true'
        run: python3 redazione/sito/collaudo_sito.py https://gommberg.com/ --veloce _sito | tee -a "$GITHUB_STEP_SUMMARY"

  collaudo:
    if: github.event.inputs.modo == 'collaudo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser
        run: pip install --quiet playwright && python -m playwright install --with-deps chromium > /dev/null
      - name: Ogni pagina di gommberg.com
        run: python redazione/sito/collaudo_sito.py https://gommberg.com/ --pagine 40 | tee -a "$GITHUB_STEP_SUMMARY"
