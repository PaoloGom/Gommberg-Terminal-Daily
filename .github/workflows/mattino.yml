# Controllo del mattino: dal lunedì al venerdì, verso le 10:15 di Roma, redazione/mattino.py guarda se l'edizione di oggi
# è uscita ed è arrivata dappertutto (sito, pubblicazione, newsletter, pannello). Nessun token del modello.
# Se tutto va bene non scrive a nessuno. Se qualcosa non va il giro fallisce e apre una segnalazione assegnata a Paolo:
# GitHub gli manda l'email. Una sola segnalazione al giorno.
name: Controllo del mattino

on:
  schedule:                        # GitHub conta in UTC e non conosce l'ora legale: due sveglie, mattino.py lavora
    - cron: "15 9 * * 1-5"         # solo nella fascia 10-12 di Roma (10:15 con l'ora solare)
    - cron: "15 8 * * 1-5"         # (10:15 con l'ora legale)
  workflow_dispatch:

permissions:
  contents: read
  actions: read                    # gli esiti di sito.yml e newsletter.yml
  issues: write                    # la segnalazione a Paolo

defaults:
  run:
    shell: bash

jobs:
  controllo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Edizione, sito, pubblicazione, newsletter, pannello
        env:
          GH_TOKEN: ${{ github.token }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          A_MANO: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 redazione/mattino.py | tee esito.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Segnalazione a Paolo
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Controllo del mattino $(TZ=Europe/Rome date +%F): qualcosa non va"
          N=$(gh issue list --state open --search "\"$T\" in:title" --json number -q 'length' 2>/dev/null || echo 0)
          [ "$N" != "0" ] || gh issue create --title "$T" --assignee "${{ github.repository_owner }}" --body-file esito.txt \
            || echo "::warning::Segnalazione non creata: resta l'avviso di GitHub per il giro fallito."
