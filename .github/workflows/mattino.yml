# Controllo del mattino: redazione/mattino.py guarda se l'edizione di oggi è uscita ed è arrivata dappertutto (sito,
# pubblicazione, newsletter, pannello). Nessun token del modello. Se tutto va bene non scrive a nessuno. Se qualcosa non
# va il giro fallisce e apre una segnalazione assegnata a Paolo: GitHub gli manda l'email. Una sola segnalazione al giorno.
# Quando parte (G-57, 23/11): appena finisce la pubblicazione del sito per il commit dell'edizione ("Edizione #NNN - data
# di oggi"). Per il caso in cui l'edizione non esce c'è la sveglia delle 10:15 di Roma, dal lunedì al venerdì: dal G-58
# la dà l'orologio di Cloudflare (redazione/sito/orologio.js, workflow_dispatch con orologio=cloudflare), perché le
# sveglie di GitHub saltano (il 23/11 non è partita nessuna delle due). Se l'edizione è già stata controllata alla
# pubblicazione, la sveglia non rifà nulla.
# Con la sveglia (non dopo la pubblicazione, per non toccare main mentre l'edizione esce) il job "gomm" aggiunge a
# dati/gomm.json le visite dei giorni completi (G-14, redazione/gomm.py) e aggiorna la stima dei minuti di GitHub in
# pannello/minuti.json (G-12, redazione/minuti.py): un commit su main che ripubblica il sito. Se non riesce non segnala
# nulla: le pagine chiedono da sole al contatore i giorni che mancano, e la stima resta quella del giorno prima.
# Minuti di GitHub (ubuntu-slim, un terzo di un minuto standard): circa 22 giri dalla pubblicazione + 22 dalla sveglia
# con due job = circa 66 minuti slim al mese, 22 minuti standard (prima di G-58: circa 110 minuti standard con le due
# sveglie di GitHub, tolte nel passo 2 di G-58).
name: Controllo del mattino

on:
  workflow_run:                    # l'innesco principale: la pubblicazione del sito appena finita (verde o rossa)
    workflows: ["Sito gommberg.com"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      orologio:
        description: "lasciare vuoto (a mano: controlla subito). Lo riempie l'orologio di Cloudflare: allora conta come la sveglia delle 10:15"
        type: string
        default: ""

permissions:
  contents: read
  actions: read                    # gli esiti di sito.yml e newsletter.yml
  issues: write                    # la segnalazione a Paolo

defaults:
  run:
    shell: bash

jobs:
  controllo:
    # dalla pubblicazione, solo per il commit di un'edizione; un'edizione di prova con un'altra data salta il controllo
    # (passo "Edizione di oggi?"), e la sveglia lo sa: conta solo un controllo che ha guardato davvero l'edizione
    if: "github.event_name != 'workflow_run' || startsWith(github.event.workflow_run.head_commit.message, 'Edizione #')"
    runs-on: ubuntu-slim             # controllo leggero (G-12): un terzo del costo di un minuto standard; al massimo 15 minuti
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Edizione di oggi?
        id: quale
        env:
          PARTENZA: ${{ github.event_name }}
          COMMIT_EDIZIONE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          OGGI=$(TZ=Europe/Rome date +%F)
          PRIMA=$(printf '%s\n' "$COMMIT_EDIZIONE" | head -1)
          if [ "$PARTENZA" = workflow_run ] && [ "${PRIMA##* - }" != "$OGGI" ]; then
            echo "Pubblicato \"$PRIMA\": non è l'edizione di oggi ($OGGI), niente da controllare." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "controlla=no" >> "$GITHUB_OUTPUT"
          else
            echo "controlla=si" >> "$GITHUB_OUTPUT"
          fi
      - name: Edizione, sito, pubblicazione, newsletter, pannello
        if: steps.quale.outputs.controlla == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          A_MANO: ${{ github.event_name == 'workflow_dispatch' && !github.event.inputs.orologio }}
          PARTENZA: ${{ github.event.inputs.orologio && 'orologio' || github.event_name }}
        run: python3 redazione/mattino.py | tee esito.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Segnalazione a Paolo
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Controllo del mattino $(TZ=Europe/Rome date +%F): qualcosa non va"
          N=$(gh issue list --state open --search "\"$T\" in:title" --json number -q 'length' 2>/dev/null || echo 0)
          [ "$N" != "0" ] || gh issue create --title "$T" --assignee "${{ github.repository_owner }}" --body-file esito.txt \
            || echo "::warning::Segnalazione non creata: resta l'avviso di GitHub per il giro fallito."

  gomm:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-slim
    timeout-minutes: 12
    continue-on-error: true        # il GOMM non fa mai fallire il controllo del mattino
    permissions:
      contents: write              # solo il commit di dati/gomm.json, con il token del giro (nessun segreto)
      actions: write               # per ripubblicare il sito: un push fatto con il token del giro non avvia sito.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Visite dei giorni completi in dati/gomm.json, minuti di GitHub in pannello/minuti.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 redazione/gomm.py | tee -a "$GITHUB_STEP_SUMMARY"
          python3 redazione/minuti.py --scrivi | tee -a "$GITHUB_STEP_SUMMARY"
          git diff --quiet -- dati/gomm.json pannello/minuti.json && [ -z "$(git ls-files --others -- pannello/minuti.json)" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dati/gomm.json; [ ! -f pannello/minuti.json ] || git add pannello/minuti.json
          git commit -q -m "GOMM: visite fino al $(python3 -c 'import json; print(json.load(open("dati/gomm.json"))["fino"])'); minuti di GitHub"
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              gh workflow run sito.yml --ref main -f modo=pubblica || echo "::warning::GOMM: sito non ripubblicato, il file nuovo va online con il prossimo push"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::GOMM: push non riuscito, le pagine chiedono al contatore i giorni mancanti"
