# Le mail straordinarie (DEM): allinea Kit ai file di redazione/dem/ (regole e formato in redazione/dem/LEGGIMI.md).
# Su main, a ogni cambiamento dei file e ogni sera alle 19:30 di Roma: crea, rifà, riporta in bozza e toglie gli invii
# in Kit. Sugli altri rami, anche lanciando a mano, controlla solo le regole e non tocca Kit. Nessun token del modello.
# La sola eccezione sono i modi "prova-" (G-43): la prova dal vivo del benvenuto prima di accenderlo, lanciata a
# mano dal ramo da provare perché la chiave di Kit sta solo qui. Fanno girare soltanto redazione/benvenuto.py piano,
# bozza, prova o pulizia (mai dem.py, mai "invia") e l'iscritto di prova si indica con la sua impronta, mai con
# l'indirizzo: il repository è pubblico e input e registri li legge chiunque. Come si fa: in testa a benvenuto.py.
# La sveglia della sera la dà l'orologio di Cloudflare (G-58, redazione/sito/orologio.js: workflow_dispatch con
# modo=sincronizza e orologio=cloudflare). Il cron "schedule" è la riserva del passo 1 di G-58: lavora solo se
# l'orologio non è sano; il passo 2 lo toglie. Due giri vicini non fanno danni: aspettano uno dopo l'altro
# (concurrency) e il secondo trova Kit già allineato.
# Minuti di GitHub: circa 30 giri della sera + 15 da push, su ubuntu-slim = circa 45-60 minuti slim al mese, 15-20
# minuti standard (prima: circa 45-60 minuti standard). Le sere con nuovi iscritti il benvenuto aspetta che Kit
# aggiorni l'elenco del gruppo (misurato: due minuti e mezzo; al massimo quanto il passo lascia, circa quattro):
# 3-5 minuti slim in più quelle sere. I modi "prova-" partono solo a mano: 0 minuti al mese; una prova intera sono 4
# giri, in tutto 6-10 minuti slim (2-4 standard). Il tetto di un giro, se Kit non risponde, sono i 15 minuti del job
# (5 delle mail straordinarie, 9 del benvenuto).
# Se va tutto bene non scrive a nessuno. Se qualcosa va guardato (una bozza vicina alla data senza ok, una mail approvata
# non partita, Kit che rifiuta un'operazione) il giro fallisce e apre una segnalazione assegnata a Paolo: GitHub gli
# manda l'email. Una sola segnalazione aperta alla volta. La chiave di Kit è il segreto KIT_API_KEY e non viene mai stampata.
name: Mail straordinarie

on:
  push:
    paths:
      - 'redazione/dem/**'
      - 'redazione/dem.py'
      - 'pannello/invii.json'
      - '.github/workflows/dem.yml'
  schedule:                        # riserva del passo 1 di G-58: 19:30 di Roma con l'ora solare (20:30 con la legale)
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "piano = legge Kit e dice che cosa farebbe; sincronizza = allinea Kit ai file (solo da main); controlla = solo le regole; prova-piano, prova-bozza, prova-invio, prova-pulizia = la prova dal vivo del benvenuto, da qualsiasi ramo (vedi benvenuto.py)"
        type: choice
        options: [piano, sincronizza, controlla, prova-piano, prova-bozza, prova-invio, prova-pulizia]
        default: piano
      impronta:
        description: "solo per prova-bozza e prova-invio: l'impronta dell'iscritto di prova (16 caratteri esadecimali, da benvenuto.py impronta). MAI un indirizzo: il repository è pubblico. Con gli altri modi lasciare vuoto"
        type: string
        default: ""
      bozza:
        description: "per prova-invio (obbligatorio) e prova-pulizia (facoltativo): il numero della bozza di prova, quello che prova-bozza scrive nell'ultima riga"
        type: string
        default: ""
      orologio:
        description: "lasciare vuoto. Lo riempie l'orologio di Cloudflare (giro della sera)"
        type: string
        default: ""

permissions:
  contents: read
  issues: write                    # la segnalazione a Paolo

concurrency:
  group: dem-${{ github.ref }}     # mai due allineamenti insieme sullo stesso ramo; i rami non si disturbano
  cancel-in-progress: false

jobs:
  allinea:
    runs-on: ubuntu-slim             # controllo leggero (G-12): un terzo del costo di un minuto standard
    timeout-minutes: 15              # 5 delle mail straordinarie + 9 del benvenuto + l'avvio: nessun passo viene chiuso dal job
    env:
      # la prova dal vivo del benvenuto (G-43): solo lanciata a mano, e allora il giro fa quella e nient'altro
      PROVA_BENVENUTO: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.modo, 'prova-') }}
    steps:
      - uses: actions/checkout@v4
      # G-43: gli input della prova arrivano al passo di prova solo se sono fatti come devono: l'impronta 16 caratteri
      # esadecimali, e già mascherata (il registro la mostra come ***: non è l'indirizzo, ma chi lo indovina la potrebbe
      # verificare); la bozza solo cifre. Si leggono dal file dell'evento: gli input non stanno in nessun "env:" e in
      # nessun comando, quindi un valore sbagliato (un indirizzo scritto per errore, un testo corto o su più righe) non
      # finisce mai nel registro. Se un valore non è valido il giro si ferma qui, con qualunque modo "prova-", e lo dice.
      - name: Input della prova controllati
        if: env.PROVA_BENVENUTO == 'true'
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          try:
              dati = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8")).get("inputs") or {}
          except Exception:
              dati = {}
          modo = str(dati.get("modo") or "")
          impronta, bozza = str(dati.get("impronta") or "").strip().lower(), str(dati.get("bozza") or "").strip()
          no = []
          if impronta and not re.fullmatch(r"[0-9a-f]{16}", impronta):
              no.append("il campo impronta contiene un valore che non è un'impronta (16 caratteri esadecimali, da benvenuto.py impronta; mai un indirizzo)"
                        + (f": per sicurezza il giro si ferma anche con {modo}, che non la usa. Lascia vuoto il campo" if modo in ("prova-piano", "prova-pulizia") else ""))
          elif not impronta and modo in ("prova-bozza", "prova-invio"):
              no.append(f"manca l'impronta dell'iscritto di prova, che {modo} richiede (benvenuto.py impronta)")
          if bozza and not re.fullmatch(r"[0-9]{1,20}", bozza):
              no.append("il campo bozza deve contenere solo il numero della bozza di prova, quello che prova-bozza scrive nell'ultima riga")
          elif not bozza and modo == "prova-invio":
              no.append("manca bozza=<numero>: prova-invio programma solo la bozza indicata, quella che prova-bozza scrive nell'ultima riga")
          if no:
              testo = "Prova del benvenuto: " + "; ".join(no) + ". Nulla di fatto."
              print(testo)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write(testo + "\n")
              sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              if impronta:
                  print(f"::add-mask::{impronta}")
                  f.write(f"IMPRONTA={impronta}\n")
              if bozza:
                  f.write(f"BOZZA={bozza}\n")
          PY
      - name: Ci pensa l'orologio?
        if: github.event_name == 'schedule'
        run: python3 redazione/sito/orologio.py --guardia dem.yml >> "$GITHUB_ENV"
      - name: Mail straordinarie
        if: env.SALTA != 'si' && env.PROVA_BENVENUTO != 'true'
        timeout-minutes: 5           # quanto aveva prima (era il tetto del job): così al benvenuto restano i suoi 9
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          SCELTO: ${{ github.event.inputs.modo || 'sincronizza' }}
        run: |
          # Kit si allinea solo ai file di main: da ogni altro ramo, anche lanciando a mano, solo il controllo delle regole
          MODO="$SCELTO"; [ "$GITHUB_REF" = "refs/heads/main" ] || MODO=controlla
          echo "Modo: $MODO"
          python3 redazione/dem.py "$MODO" 2>&1 | tee esito.txt | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      # G-43: la mail di benvenuto ai nuovi iscritti (redazione/benvenuto.py; il piano gratuito di Kit non ha
      # automazioni). Solo nel giro della sera (sveglia o lancio a mano), mai sui push e mai nei modi "prova-"; gira
      # anche se il passo di sopra è fallito (sono due lavori diversi); da un ramo che non è main solo il controllo del
      # testo, senza rete.
      # Minuti di GitHub: qualche secondo per giro dentro un job che c'è già, quando non ci sono nuovi iscritti (quasi
      # tutte le sere); con nuovi iscritti aspetta che Kit aggiorni l'elenco del gruppo, di solito due minuti e mezzo, al
      # massimo quanto il passo lascia (3-5 minuti slim in più quella sera); se non basta il gruppo resta in sospeso e lo
      # riprende il giro dopo. I 9 minuti servono a questa attesa e a Kit che non risponde: benvenuto.py si dà 510
      # secondi e si arrende da sé prima, con il suo messaggio; programma un invio solo se restano i secondi per
      # rileggerlo e toglierlo, e prende in carico solo gli iscritti che stanno nel tempo.
      - name: Benvenuto
        if: ${{ !cancelled() && github.event_name != 'push' && env.SALTA != 'si' && env.PROVA_BENVENUTO != 'true' }}
        timeout-minutes: 9
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          SCELTO: ${{ github.event.inputs.modo || 'sincronizza' }}
        run: |
          case "$SCELTO" in sincronizza) MODO=invia ;; piano) MODO=piano ;; *) MODO=controlla ;; esac
          [ "$GITHUB_REF" = "refs/heads/main" ] || MODO=controlla
          echo "Benvenuto, modo: $MODO"
          python3 redazione/benvenuto.py "$MODO" 2>&1 | tee benvenuto.txt | tee -a esito.txt | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      # G-43: la prova dal vivo del benvenuto, da qualsiasi ramo ma solo lanciata a mano. Solo benvenuto.py: piano (sole
      # letture), bozza (una bozza per un gruppo di prova con dentro il solo iscritto dell'impronta, niente parte),
      # prova (programma la bozza di prova indicata per numero, solo se riletta è per quel gruppo e il gruppo ha dentro
      # lui solo) o pulizia (toglie le bozze di prova non programmate e le etichette dei gruppi di prova). Impronta e
      # numero della bozza arrivano dal passo "Input della prova controllati", già controllati (l'impronta anche
      # mascherata), in variabili d'ambiente: mai scritti dentro il comando. Il riepilogo del giro dice che cosa è successo, che cosa ha risposto Kit e che cosa resta in
      # Kit, senza indirizzi. Se un invio di prova non si riesce né a togliere né a riportare in bozza, il passo
      # "Urgenza benvenuto" apre la segnalazione anche da un ramo.
      - name: Prova del benvenuto
        if: env.PROVA_BENVENUTO == 'true'
        timeout-minutes: 9
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          SCELTO: ${{ github.event.inputs.modo }}
        run: |
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || { echo "Prova del benvenuto: solo lanciata a mano. Nulla di fatto"; exit 1; }
          case "$SCELTO" in
            prova-piano) set -- piano ;;
            prova-bozza) set -- bozza "impronta:${IMPRONTA:-}" ;;
            prova-invio) set -- prova "impronta:${IMPRONTA:-}" "bozza:${BOZZA:-}" ;;
            prova-pulizia) if [ -n "${BOZZA:-}" ]; then set -- pulizia "bozza:$BOZZA"; else set -- pulizia; fi ;;
            *) echo "Prova del benvenuto: modo non previsto. Nulla di fatto"; exit 1 ;;
          esac
          echo "Prova del benvenuto, comando: $1"
          python3 redazione/benvenuto.py "$@" 2>&1 | tee benvenuto.txt | tee -a esito.txt | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - name: Segnalazione a Paolo
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="Mail straordinarie: c'è qualcosa da guardare"
          N=$(gh issue list --state open --search "\"$T\" in:title" --json number -q 'length' 2>/dev/null) || N=""
          [ -f esito.txt ] || echo "Il giro non è arrivato a scrivere l'esito: vedi il log di GitHub Actions." > esito.txt
          if [ -z "$N" ]; then
            echo "::warning::Elenco delle segnalazioni non leggibile: nessuna segnalazione nuova, resta l'avviso di GitHub per il giro fallito."
          elif [ "$N" = "0" ]; then
            gh issue create --title "$T" --assignee "${{ github.repository_owner }}" --body-file esito.txt \
              || echo "::warning::Segnalazione non creata: resta l'avviso di GitHub per il giro fallito."
          fi
      # G-43: un invio del benvenuto che non si è potuto né togliere né riportare in bozza può partire con destinatari
      # sbagliati. Questa segnalazione si apre SEMPRE, anche se ce n'è già una aperta, perché è da fare subito: da main
      # e, nella prova dal vivo, da qualsiasi ramo.
      - name: Urgenza benvenuto
        if: failure() && (github.ref == 'refs/heads/main' || env.PROVA_BENVENUTO == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f benvenuto.txt ] && grep -q URGENTE benvenuto.txt; then
            grep URGENTE benvenuto.txt > urgente.txt
            gh issue create --title "URGENTE: invio del benvenuto da fermare a mano in Kit" \
              --assignee "${{ github.repository_owner }}" --body-file urgente.txt \
              || echo "::error::URGENTE: invio del benvenuto da fermare a mano in Kit (segnalazione non creata)"
          fi
