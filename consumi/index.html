<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Consumo dell'attività automatica - Gommberg Terminal Daily</title>
<meta name="theme-color" content="#0E0E0E">
<link rel="icon" href="../assets/icona.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#FAF8F4;--sheet:#FFFFFF;--ink:#141414;--muted:#6B655E;--rule:#DEDAD4;--panel:#F1EEE9;--orange:#F26B1D;--mark:#D9560B;
--up:#157A3E;--down:#C0271D;--bar:#0E0E0E;--bar-ink:#F5F3EF;
--display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;--body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--paper:#121110;--sheet:#1A1816;--ink:#EDEAE5;--muted:#A49E96;--rule:#2E2B28;--panel:#1C1A18;--orange:#FF7A2E;--mark:#E8691E;--up:#4CC27A;--down:#FF6B5E;--bar:#050505;color-scheme:dark}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
a{color:inherit}
.top{background:var(--bar);color:var(--bar-ink)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px}
.logo{font-family:var(--display);font-stretch:85%;font-weight:900;font-size:19px;letter-spacing:.01em;text-decoration:none;color:var(--bar-ink)}
.logo b{color:var(--orange)}
.top span{font-family:var(--mono);font-size:11.5px;color:#B9B3AA}
.wrap{max-width:1040px;margin:0 auto;padding-inline:24px}
@media (max-width:760px){.wrap{padding-inline:16px}}
main{padding-block:30px 56px}
h1{font-family:var(--display);font-stretch:85%;font-weight:900;font-size:clamp(28px,5vw,40px);line-height:1.05;margin:0 0 8px}
.sub{color:var(--muted);max-width:62ch;margin:0}
.lede{font-size:19px;line-height:1.4;max-width:60ch;margin:22px 0 0;padding-left:14px;border-left:3px solid var(--orange)}
.lede b{font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:26px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--ink);padding:12px 14px 14px}
.tile .k{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:30px;line-height:1.1;margin-top:6px}
.tile .v{white-space:nowrap}
.tile .v small{font-size:15px;font-weight:600;color:var(--muted)}
.tile .n{font-size:13px;color:var(--muted);margin-top:4px}
.su{color:var(--up)}.giu{color:var(--down)}
.lett{background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--orange);padding:16px 18px;margin-top:22px}
.lett h2{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.lett .stato{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:22px;line-height:1.15;margin:0 0 10px}
.lett ul{margin:0;padding-left:18px}.lett li{margin:5px 0;max-width:80ch}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.chip.m{border-color:var(--ink);color:var(--ink)}
.metro{margin-top:14px}.metro .b{display:flex;height:14px;background:var(--panel);border-radius:4px;overflow:hidden}
.metro .b i{display:block;background:var(--mark)}.metro .l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:5px}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:26px 0 -18px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.ctl button{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:5px 10px;cursor:pointer}
.ctl button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:8px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:6px;background:var(--mark)}
.leg i.st{background:repeating-linear-gradient(135deg,var(--mark) 0 2px,transparent 2px 5px);outline:1px solid var(--mark);outline-offset:-1px}
.sec{margin-top:44px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:16px}
.sec-head h2{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:23px;line-height:1.1;margin:0}
.sec-head span{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
@media (max-width:560px){.sec-head{flex-direction:column;gap:4px}.sec-head span{text-align:left}.card{padding:12px}}
.card{background:var(--sheet);border:1px solid var(--rule);padding:16px}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.grid{stroke:var(--rule);stroke-width:1}
.col{fill:var(--mark);pointer-events:none}
.col.st{fill:url(#trat);stroke:var(--mark);stroke-width:1}
.hit{fill:transparent;cursor:default}
.hit:hover+.col,.hit:focus+.col{opacity:.72}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{padding:7px 10px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
th{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--ink)}
th:first-child,td:first-child{text-align:left}
td{font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--muted);max-width:78ch;margin-top:14px}
.vuoto{background:var(--sheet);border:1px dashed var(--rule);padding:28px;margin-top:26px;color:var(--muted)}
#tip{position:fixed;z-index:9;pointer-events:none;background:var(--bar);color:var(--bar-ink);font-size:12.5px;line-height:1.35;padding:7px 9px;border-radius:4px;opacity:0;transition:opacity .08s;max-width:240px}
#tip b{font-weight:600}
</style>
</head>
<body>
<div class="top"><div class="wrap"><a class="logo" href="../"><b>GOMMBERG</b> TERMINAL DAILY</a><span>pagina di servizio</span></div></div>
<main class="wrap">
<h1>Consumo dell'attività automatica</h1>
<p class="sub">Quanto lavora l'edizione del mattino e quanto pesa sul limite settimanale del piano, edizione per edizione e versione per versione. Le misure le scrive il kit a ogni uscita, senza spendere token.</p>
<div id="app"></div>
</main>
<div id="tip" role="status"></div>
<script>
(function(){
var RIF="Pro";  /* il piano a cui si rapporta la stima: quello che resterà */
var G=["dom","lun","mar","mer","gio","ven","sab"],M=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
function it(x,d){return x.toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d})}
function gg(s){var p=s.split("-");return new Date(+p[0],p[1]-1,+p[2])}
function data(s){var d=gg(s);return G[d.getDay()]+" "+d.getDate()+" "+M[d.getMonth()]}
function breve(s){var d=gg(s);return d.getDate()+" "+M[d.getMonth()]}
function num(n){return n==null?"":"#"+("00"+n).slice(-3)}
function seg(v){if(v==null||!isFinite(v))return '<span>-</span>';var c=v>0?"su":v<0?"giu":"";return '<span class="'+c+'">'+(v>0?"+":"")+it(v,1)+"%</span>"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function med(a){return a.length?a.reduce(function(s,x){return s+x},0)/a.length:null}
var app=document.getElementById("app"),tip=document.getElementById("tip"),PER=30,DATI=null;
function vuoto(t){app.innerHTML='<div class="vuoto">'+t+"</div>"}
function leggi(f){return fetch(f,{cache:"no-store"}).then(function(r){return r.ok?r.json():[]}).catch(function(){return []})}
Promise.all([leggi("registro.json"),leggi("taratura.json")]).then(function(r){
  if(!r[0]||!r[0].length){vuoto("Nessuna edizione registrata. La prima riga arriva con la prossima uscita.");return}
  DATI=[r[0],r[1]||[]];disegna(DATI[0],DATI[1])});
app.addEventListener("click",function(e){var p=e.target.getAttribute&&e.target.getAttribute("data-per");if(p&&DATI){PER=+p;disegna(DATI[0],DATI[1])}});

function disegna(reg,tar){
  tar=tar.filter(function(x){return x.durata_min>0&&x.punti>0});
  var piano=tar.some(function(x){return x.piano==RIF})?RIF:(tar.length?tar[tar.length-1].piano:null),tt=tar.filter(function(x){return x.piano==piano});
  var tasso=tt.length?tt.reduce(function(s,x){return s+x.punti},0)/tt.reduce(function(s,x){return s+x.durata_min},0):null;
  var tmin=tt.length?Math.min.apply(null,tt.map(function(x){return x.punti/x.durata_min})):null,tmax=tt.length?Math.max.apply(null,tt.map(function(x){return x.punti/x.durata_min})):null;
  /* token misurati dal gancio: un punto del piano vale tanti token quanti ne escono dalle edizioni misurate */
  var mis=reg.filter(function(x){return x.pesati>0&&x.durata_min>0});
  var tokMin=mis.length?mis.reduce(function(s,x){return s+x.pesati},0)/mis.reduce(function(s,x){return s+x.durata_min},0):null,tokPunto=tasso&&tokMin?tokMin/tasso:null;
  function mln(x){return it(x/1e6,2)}
  reg.forEach(function(x){x.v2=x.pesati>0&&tokPunto?x.pesati/tokPunto:(x.durata_min!=null?(tasso?x.durata_min*tasso:x.durata_min):null)});
  function val(v){return v==null?"-":tasso?"≈ "+it(v,1):it(v,0)}
  var unita=tasso?"punti "+piano:"min";
  /* le versioni, nell'ordine in cui sono uscite */
  var vers=[];reg.forEach(function(x){var k=x.v||"?",l=vers[vers.length-1];if(!l||l.v!=k){l={v:k,r:[]};vers.push(l)}l.r.push(x)});
  vers.forEach(function(g){var d=g.r.filter(function(x){return x.durata_min!=null});
    g.n=g.r.length;g.dur=med(d.map(function(x){return x.durata_min}));
    g.tok=med(g.r.filter(function(x){return x.pesati>0}).map(function(x){return x.pesati}));
    g.st=tasso?med(g.r.filter(function(x){return x.v2!=null}).map(function(x){return x.v2})):null;
    g.sch=med(g.r.filter(function(x){return x.schede!=null}).map(function(x){return x.schede}));g.fon=med(g.r.filter(function(x){return x.fonti!=null}).map(function(x){return x.fonti}));
    g.kb=g.r[g.r.length-1].avvio_kb;g.dal=g.r[0].d;g.al=g.r[g.r.length-1].d});
  vers.forEach(function(g,i){var p=null;for(var j=i-1;j>=0;j--)if(vers[j].dur!=null){p=vers[j];break}
    g.var=p&&g.tok&&p.tok?(g.tok/p.tok-1)*100:(g.dur!=null&&p?(g.dur/p.dur-1)*100:null)});
  var u=reg[reg.length-1],vu=vers[vers.length-1],con=reg.filter(function(x){return x.v2!=null});
  var ult5=con.slice(-5),tipo=ult5.length?med(ult5.map(function(x){return x.v2}))*5:null;
  var h="";
  if(false)h+='<p class="lede">Con la '+esc(vu.v)+" un'edizione pesa circa <b>"+it(vu.st,1)+" punti su 100</b> del limite settimanale del piano "+esc(piano)+" (tra "+it(vu.st*tmin/tasso,1)+" e "+it(vu.st*tmax/tasso,1)+"): cinque edizioni, circa <b>"+it(vu.st*5,0)+"</b>."+(vu.tok?" Token misurati: <b>"+mln(vu.tok)+" milioni</b> pesati a edizione.":"")+"</p>";
  /* la lettura: cosa dicono i numeri, in chiaro */
  var mv=vu.r.filter(function(x){return x.v2!=null}),mvm=med(mv.map(function(x){return x.v2})),du=u.v2!=null&&mvm?(u.v2/mvm-1)*100:null;
  var nmis=reg.filter(function(x){return x.pesati>0}).length,buchi=reg.filter(function(x){return x.durata_min==null}).length,primaMis=reg.filter(function(x){return x.pesati>0})[0];
  var perse=primaMis?reg.filter(function(x){return x.n>primaMis.n&&!(x.pesati>0)}).length:0;
  var alto=du!=null&&du>30,stato=perse?"Attenzione: "+perse+(perse==1?" edizione senza misura dei token":" edizioni senza misura dei token"):alto?"Attenzione: l'ultima edizione è costata più del solito":"Consumo nella norma";
  var L2=[];
  if(tasso&&vu.st!=null)L2.push("<b>Quanto pesa.</b> Con la "+esc(vu.v)+" un'edizione vale circa "+it(vu.st,1)+" punti su 100 del limite settimanale "+esc(piano)+" (tra "+it(vu.st*tmin/tasso,1)+" e "+it(vu.st*tmax/tasso,1)+"). Cinque edizioni: circa "+it(vu.st*5,0)+" punti, quindi ne restano circa "+it(Math.max(0,100-vu.st*5),0)+" per le chat."+(vu.tok?" In token: "+mln(vu.tok)+" milioni pesati a edizione, misurati.":""));
  if(u.v2!=null)L2.push("<b>Ultima edizione.</b> "+num(u.n)+" di "+data(u.d)+": "+(tasso?"circa "+it(u.v2,1)+" punti":u.durata_min+" minuti")+(du!=null&&mv.length>1?", "+(du>=0?"+":"")+it(du,0)+"% sulla media della "+esc(vu.v):"")+".");
  var pv=null;for(var q=vers.length-2;q>=0;q--)if(vers[q].dur!=null){pv=vers[q];break}
  if(pv&&vu.var!=null)L2.push("<b>Versione.</b> La "+esc(vu.v)+" costa il "+it(Math.abs(vu.var),0)+"% in "+(vu.var<0?"meno":"più")+" della "+esc(pv.v)+" ("+(vu.tok&&pv.tok?"token medi":"durata media: "+it(vu.dur,0)+" contro "+it(pv.dur,0)+" minuti")+")."+(vu.kb&&pv.kb&&vu.kb!=pv.kb?" A ogni avvio legge "+vu.kb+" KB, contro "+pv.kb+".":""));
  L2.push("<b>Quanto fidarsi.</b> "+(nmis?(nmis==1?"1 edizione su "+reg.length+" ha":nmis+" edizioni su "+reg.length+" hanno")+" i token misurati; le altre sono stimate dalla durata.":"Nessuna edizione ha ancora i token misurati: la misura parte dalla prossima uscita. Per ora ogni valore è una stima dalla durata.")+" I punti del piano sono sempre una stima."+(buchi?" "+buchi+" edizioni rifatte a mano non hanno durata e restano fuori.":""));
  h+='<div class="lett"><h2>La lettura</h2><p class="stato">'+stato+"</p><ul>"+L2.map(function(x){return "<li>"+x+"</li>"}).join("")+"</ul>"
   +(tasso&&vu.st!=null?'<div class="metro"><div class="b" role="img" aria-label="Quota del limite settimanale usata da cinque edizioni"><i style="width:'+Math.min(100,vu.st*5)+'%"></i></div><div class="l"><span>5 edizioni: ≈ '+it(vu.st*5,0)+" punti</span><span>limite settimanale "+esc(piano)+": 100</span></div></div>":"")+"</div>";
  h+='<div class="tiles">'
   +'<div class="tile"><div class="k">Ultima edizione</div><div class="v">'+val(u.v2)+' <small>'+(u.v2!=null?unita:"")+'</small></div><div class="n">'+num(u.n)+" "+data(u.d)+(u.pesati>0?" · "+mln(u.pesati)+" mln di token":(u.durata_min!=null?" · "+u.durata_min+" min":" · durata non nota"))+"</div></div>"
   +'<div class="tile"><div class="k">Settimana tipo</div><div class="v">'+(tipo!=null?val(tipo):"-")+' <small>'+(tasso?"su 100":unita)+'</small></div><div class="n">cinque edizioni come le ultime '+ult5.length+"</div></div>"
   +'<div class="tile"><div class="k">Versione in uso</div><div class="v">'+esc(vu.v)+'</div><div class="n">'+vu.n+(vu.n==1?" edizione":" edizioni")+(vu.dur!=null?" · media "+it(vu.dur,0)+" min":"")+"</div></div>"
   +'<div class="tile"><div class="k">Sulla versione prima</div><div class="v">'+seg(vu.var)+'</div><div class="n">'+(vu.tok?"token medi a edizione":"durata media, e quindi peso stimato")+'</div></div></div>';
  if(!tasso)h+='<p class="note">Manca una lettura vera del consumo: per ora la pagina mostra i minuti di lavoro.</p>';

  /* 1. una serie, una misura: colonne per edizione, con il cambio di versione segnato */
  var W=Math.max(320,Math.min(960,(app.clientWidth||960)-34)),S=reg.slice(-(W<560?Math.min(12,PER):PER)),H=W<560?226:276,L=40,R=6,T=30,B=30;
  var m=Math.max.apply(null,S.map(function(x){return x.v2||0}))||1;
  var passo=m>60?20:m>30?10:m>12?5:m>6?2:m>3?1:m>1.2?0.5:m>0.5?0.2:0.1,top=Math.ceil(m*1.05/passo)*passo,pw=(W-L-R)/S.length,bw=Math.min(34,Math.max(4,pw-2));
  var g='<defs><pattern id="trat" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="5" fill="var(--mark)"/></pattern></defs>';for(var t=0;t<=top+passo/2;t+=passo){var y=T+(H-T-B)*(1-t/top);g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+it(t,passo<1?1:0)+"</text>"}
  var ogni=Math.ceil(S.length/(W<560?4:10));
  S.forEach(function(x,i){var cx=L+pw*i+pw/2,tx="<b>"+num(x.n)+" "+data(x.d)+"</b> · "+esc(x.v||"?")+"<br>";
    if(i==0||(S[i-1].v||"?")!=(x.v||"?")){var x0=L+pw*i;if(i>0)g+='<line x1="'+x0+'" x2="'+x0+'" y1="'+(T-18)+'" y2="'+(H-B)+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>';
      g+='<text x="'+(x0+4)+'" y="'+(T-8)+'" style="fill:var(--ink);font-weight:500">'+esc(x.v||"?")+"</text>"}
    if(x.v2==null){tx+="uscita alle "+(x.ora||"?")+": edizione rifatta a mano, durata non nota";g+='<text x="'+cx+'" y="'+(H-B-6)+'" text-anchor="middle">·</text>'}
    else tx+=(tasso?"≈ "+it(x.v2,1)+" punti "+esc(piano)+"<br>":"")+(x.pesati>0?mln(x.pesati)+" mln di token pesati, misurati · "+x.richieste+" passi<br>":"")+(x.durata_min!=null?x.durata_min+" min":"")+(x.schede!=null?" · "+x.schede+" schede · "+x.fonti+" fonti":"");
    g+='<rect class="hit" tabindex="0" x="'+(cx-pw/2)+'" y="'+T+'" width="'+pw+'" height="'+(H-T-B)+'" data-t="'+esc(tx)+'"/>';
    if(x.v2!=null){var bh=(H-T-B)*x.v2/top,y=H-B-bh,r=Math.min(4,bw/2,bh);
      g+='<path class="col'+(x.pesati>0?"":" st")+'" d="M'+(cx-bw/2)+" "+(H-B)+"V"+(y+r)+"q0 -"+r+" "+r+" -"+r+"H"+(cx+bw/2-r)+"q"+r+" 0 "+r+" "+r+"V"+(H-B)+'z"/>'}
    if(i%ogni==0||i==S.length-1)g+='<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle">'+breve(x.d)+"</text>"});
  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" stroke="var(--ink)" stroke-width="1"/>';
  h+='<div class="ctl"><span>Periodo</span>'+[[10,"ultime 10"],[30,"ultime 30"],[9999,"tutte"]].map(function(o){return '<button type="button" data-per="'+o[0]+'" aria-pressed="'+(PER==o[0])+'">'+o[1]+"</button>"}).join("")+"</div>";
  h+='<section class="sec"><div class="sec-head"><h2>Edizione per edizione</h2><span>'+(tasso?"punti su 100 del limite settimanale "+esc(piano)+", stima":"minuti")+" · linee tratteggiate: cambio di versione</span></div>"
   +'<div class="card"><div class="leg"><span><i></i>token misurati</span><span><i class="st"></i>stima dalla durata</span></div><svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+(tasso?"Peso stimato":"Durata")+' di ogni edizione, con le versioni del kit. I valori sono nelle tabelle qui sotto.">'+g+"</svg></div></section>";

  /* 2. versione per versione: è qui che si vede se una modifica ha fatto salire o scendere il consumo */
  h+='<section class="sec"><div class="sec-head"><h2>Versione per versione</h2><span>medie per versione del kit · avvio = KB letti per intero a ogni corsa</span></div><div class="tw"><table><thead><tr><th>Versione</th><th>Edizioni</th><th>Periodo</th><th>Durata</th>'+(tasso?"<th>Punti "+esc(piano)+"</th>":"")+"<th>Token (mln)</th><th>Sulla prima</th><th>Avvio (KB)</th><th>Schede</th><th>Fonti</th></tr></thead><tbody>"
   +vers.slice().reverse().map(function(v){return "<tr><td><b>"+esc(v.v)+"</b></td><td>"+v.n+"</td><td>"+breve(v.dal)+(v.al!=v.dal?" - "+breve(v.al):"")+"</td><td>"+(v.dur!=null?it(v.dur,0)+" min":"-")+"</td>"+(tasso?"<td>"+(v.st!=null?it(v.st,1):"-")+"</td>":"")+"<td>"+(v.tok?mln(v.tok):"-")+"</td><td>"+seg(v.var)+"</td><td>"+(v.kb!=null?v.kb:"-")+"</td><td>"+(v.sch!=null?it(v.sch,0):"-")+"</td><td>"+(v.fon!=null?it(v.fon,0):"-")+"</td></tr>"}).join("")+"</tbody></table></div></section>";

  /* 3. tutte le edizioni recenti */
  var righe=reg.slice(-Math.min(PER,reg.length)).reverse().map(function(x){
    return "<tr><td>"+data(x.d)+" "+num(x.n)+"</td><td>"+esc(x.v||"-")+"</td>"+(tasso?"<td>"+(x.v2!=null?it(x.v2,1):"-")+"</td>":"")+"<td>"+(x.pesati>0?'<span class="chip m">misurata</span>':x.v2!=null?'<span class="chip">stimata</span>':"-")+"</td><td>"+(x.pesati>0?mln(x.pesati):"-")+"</td><td>"+(x.richieste||"-")+"</td><td>"+(x.durata_min!=null?x.durata_min+" min":"-")+"</td><td>"+(x.ora||"-")+"</td><td>"+(x.schede!=null?x.schede:"-")+"</td><td>"+(x.fonti!=null?x.fonti:"-")+"</td></tr>"}).join("");
  h+='<section class="sec"><div class="sec-head"><h2>Le ultime edizioni</h2><span>'+Math.min(PER,reg.length)+' edizioni</span></div><div class="tw"><table><thead><tr><th>Edizione</th><th>Versione</th>'+(tasso?"<th>Punti "+esc(piano)+"</th>":"")+"<th>Base</th><th>Token (mln)</th><th>Passi</th><th>Durata</th><th>Uscita</th><th>Schede dei fatti</th><th>Fonti citate</th></tr></thead><tbody>"+righe+"</tbody></table></div></section>";

  /* 4. le letture vere su cui poggia la stima */
  if(tar.length){
    h+='<section class="sec"><div class="sec-head"><h2>Da dove viene la stima</h2><span>piano '+esc(piano)+": "+it(tasso*60,1)+" punti per ora di attività (tra "+it(tmin*60,1)+" e "+it(tmax*60,1)+")</span></div>"
     +'<div class="tw"><table><thead><tr><th>Lettura della pagina Utilizzo</th><th>Piano</th><th>Punti</th><th>Minuti di attività</th><th>Punti all\'ora</th><th>Usata</th></tr></thead><tbody>'
     +tar.slice().reverse().map(function(x){return '<tr><td style="white-space:normal;min-width:260px">'+data(x.giorno)+(x.nota?" · "+esc(x.nota):"")+"</td><td>"+esc(x.piano)+"</td><td>"+it(x.punti,1)+"</td><td>"+it(x.durata_min,0)+"</td><td>"+it(x.punti/x.durata_min*60,1)+"</td><td>"+(x.piano==piano?"sì":"no")+"</td></tr>"}).join("")+"</tbody></table></div>"
     +'<p class="note">I token sono misurati: dal 16/11 un gancio li somma dalla trascrizione di ogni sessione, senza spendere token (pesati = ingresso + 2 x scritti in cache + 0,1 x letti dalla cache + 5 x in uscita). Il peso in punti del piano '+esc(piano)+" è invece una stima: per le edizioni misurate, i loro token rapportati al tasso delle letture; per quelle di prima, la durata per lo stesso tasso. Le letture sono i punti della pagina Utilizzo dell'app prima e dopo una corsa (100 è il limite della settimana): sono poche e arrotondate al punto, quindi l'errore sui punti è nell'ordine di un terzo. La durata fino alla #025 è ricostruita dall'ora di avvio e di uscita.</p></section>"}
  app.innerHTML=h;
  if(app._asc)return;app._asc=1;
  app.addEventListener("pointermove",function(e){var t=e.target.getAttribute&&e.target.getAttribute("data-t");if(!t){tip.style.opacity=0;return}
    tip.innerHTML=t;tip.style.opacity=1;var x=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8),y=e.clientY-tip.offsetHeight-12;tip.style.left=x+"px";tip.style.top=(y<8?e.clientY+16:y)+"px"});
  app.addEventListener("pointerleave",function(){tip.style.opacity=0});
  app.addEventListener("focusin",function(e){var t=e.target.getAttribute&&e.target.getAttribute("data-t");if(!t)return;var b=e.target.getBoundingClientRect();tip.innerHTML=t;tip.style.opacity=1;tip.style.left=Math.min(b.left,innerWidth-tip.offsetWidth-8)+"px";tip.style.top=Math.max(8,b.top-tip.offsetHeight-6)+"px"});
  app.addEventListener("focusout",function(){tip.style.opacity=0});
}})();
</script>
</body>
</html>
