<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Consumo dell'attività automatica - Gommberg Terminal Daily</title>
<meta name="theme-color" content="#0E0E0E">
<link rel="icon" href="../assets/icona.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#FAF8F4;--sheet:#FFFFFF;--ink:#141414;--muted:#6B655E;--rule:#DEDAD4;--panel:#F1EEE9;--orange:#F26B1D;--mark:#D9560B;
--up:#157A3E;--down:#C0271D;--bar:#0E0E0E;--bar-ink:#F5F3EF;
--display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;--body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--paper:#121110;--sheet:#1A1816;--ink:#EDEAE5;--muted:#A49E96;--rule:#2E2B28;--panel:#1C1A18;--orange:#FF7A2E;--mark:#E8691E;--up:#4CC27A;--down:#FF6B5E;--bar:#050505;color-scheme:dark}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
a{color:inherit}
.top{background:var(--bar);color:var(--bar-ink)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px}
.logo{font-family:var(--display);font-stretch:85%;font-weight:900;font-size:19px;letter-spacing:.01em;text-decoration:none;color:var(--bar-ink)}
.logo b{color:var(--orange)}
.top span{font-family:var(--mono);font-size:11.5px;color:#B9B3AA}
.wrap{max-width:1040px;margin:0 auto;padding-inline:24px}
@media (max-width:760px){.wrap{padding-inline:16px}}
main{padding-block:30px 56px}
h1{font-family:var(--display);font-stretch:85%;font-weight:900;font-size:clamp(28px,5vw,40px);line-height:1.05;margin:0 0 8px}
.sub{color:var(--muted);max-width:62ch;margin:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:26px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--ink);padding:12px 14px 14px}
.tile .k{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:30px;line-height:1.1;margin-top:6px}
.tile .v small{font-size:15px;font-weight:600;color:var(--muted)}
.tile .n{font-size:13px;color:var(--muted);margin-top:4px}
.su{color:var(--up)}.giu{color:var(--down)}
.sec{margin-top:44px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:16px}
.sec-head h2{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:23px;line-height:1.1;margin:0}
.sec-head span{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
@media (max-width:560px){.sec-head{flex-direction:column;gap:4px}.sec-head span{text-align:left}.card{padding:12px}}
.card{background:var(--sheet);border:1px solid var(--rule);padding:16px}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.grid{stroke:var(--rule);stroke-width:1}
.col{fill:var(--mark);pointer-events:none}
.col.ultima{fill:var(--ink)}
.hit{fill:transparent;cursor:default}
.hit:hover+.col,.hit:focus+.col{opacity:.72}
.righe{display:grid;gap:10px}
.r{display:grid;grid-template-columns:minmax(120px,210px) 1fr 86px;gap:12px;align-items:center;font-size:14.5px}
.r .b{height:12px;background:var(--panel);border-radius:0 4px 4px 0;overflow:hidden}
.r .b i{display:block;height:100%;background:var(--mark);border-radius:0 4px 4px 0}
.r .p{font-family:var(--mono);font-size:13px;text-align:right}
.r .p small{color:var(--muted)}
@media (max-width:560px){.r{grid-template-columns:1fr 74px}.r .b{grid-column:1/-1;order:3}}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{padding:7px 10px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
th{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--ink)}
th:first-child,td:first-child{text-align:left}
td{font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--muted);max-width:78ch;margin-top:14px}
.vuoto{background:var(--sheet);border:1px dashed var(--rule);padding:28px;margin-top:26px;color:var(--muted)}
#tip{position:fixed;z-index:9;pointer-events:none;background:var(--bar);color:var(--bar-ink);font-size:12.5px;line-height:1.35;padding:7px 9px;border-radius:4px;opacity:0;transition:opacity .08s;max-width:240px}
#tip b{font-weight:600}
</style>
</head>
<body>
<div class="top"><div class="wrap"><a class="logo" href="../"><b>GOMMBERG</b> TERMINAL DAILY</a><span>pagina di servizio</span></div></div>
<main class="wrap">
<h1>Consumo dell'attività automatica</h1>
<p class="sub">Quanti token spende l'edizione del mattino, giorno per giorno, e dove vanno. I numeri li misura il sistema e li registra l'attività a fine lavoro.</p>
<div id="app"></div>
</main>
<div id="tip" role="status"></div>
<script>
(function(){
var G=["dom","lun","mar","mer","gio","ven","sab"],M=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
var NOMI={istruzioni:"Contesto riletto a ogni passo",web:"Ricerca web",comandi:"File e comandi",testo:"Testo e ragionamento",agenti:"Agenti",altro:"Altro"};
function it(x,d){return x.toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d})}
function mln(x){return it(x/1e6,2)}
function data(s){var p=s.split("-"),d=new Date(+p[0],p[1]-1,+p[2]);return G[d.getDay()]+" "+d.getDate()+" "+M[d.getMonth()]}
function num(n){return n==null?"":"#"+("00"+n).slice(-3)}
function vari(a,b){if(!b)return null;return (a/b-1)*100}
function seg(v){if(v==null)return '<span>-</span>';var c=v>0?"su":v<0?"giu":"";return '<span class="'+c+'">'+(v>0?"+":"")+it(v,1)+"%</span>"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var app=document.getElementById("app"),tip=document.getElementById("tip");
function vuoto(t){app.innerHTML='<div class="vuoto">'+t+"</div>"}
fetch("registro.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(reg){
  var prova=/[?&]prova=1/.test(location.search);
  reg=(reg||[]).filter(function(x){return prova||!x.prova});
  if(!reg.length){vuoto("Nessuna misura ancora. La prima riga arriva con la prossima edizione.");return}
  disegna(reg)}).catch(function(){vuoto("Il registro dei consumi non è ancora disponibile.")});

function disegna(reg){
  var u=reg[reg.length-1],prec=reg.slice(Math.max(0,reg.length-6),reg.length-1);
  var media=prec.length?prec.reduce(function(s,x){return s+x.pesati},0)/prec.length:null,v=vari(u.pesati,media);
  var h='<div class="tiles">'
   +'<div class="tile"><div class="k">Ultima edizione</div><div class="v">'+mln(u.pesati)+' <small>mln</small></div><div class="n">token pesati · '+num(u.n)+" "+data(u.d)+"</div></div>"
   +'<div class="tile"><div class="k">Rispetto alla media</div><div class="v">'+seg(v)+'</div><div class="n">'+(media?"media delle "+prec.length+" precedenti: "+mln(media)+" mln":"serve almeno un'altra edizione")+"</div></div>"
   +'<div class="tile"><div class="k">Passi del modello</div><div class="v">'+it(u.richieste,0)+'</div><div class="n">richieste nella sessione</div></div>'
   +'<div class="tile"><div class="k">Durata</div><div class="v">'+(u.durata_min!=null?u.durata_min+' <small>min</small>':"-")+'</div><div class="n">'+(u.ora?"uscita alle "+u.ora:"ora di uscita non registrata")+"</div></div></div>";

  /* 1. una serie, una misura: colonne per edizione */
  var W=Math.max(320,Math.min(960,(app.clientWidth||960)-34)),S=reg.slice(W<560?-12:-30),H=W<560?210:260,L=40,R=6,T=14,B=30,max=Math.max.apply(null,S.map(function(x){return x.pesati}));
  var passo=max>8e6?2e6:max>4e6?1e6:max>1.6e6?5e5:max>6e5?2e5:1e5,top=Math.ceil(max*1.05/passo)*passo,pw=(W-L-R)/S.length,bw=Math.min(34,Math.max(4,pw-2));
  var g="";for(var t=0;t<=top+1;t+=passo){var y=T+(H-T-B)*(1-t/top);g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+it(t/1e6,passo<1e6?1:0)+"</text>"}
  var ogni=Math.ceil(S.length/(W<560?4:10));
  S.forEach(function(x,i){var cx=L+pw*i+pw/2,bh=(H-T-B)*x.pesati/top,y=H-B-bh,r=Math.min(4,bw/2,bh);
    g+='<rect class="hit" tabindex="0" x="'+(cx-pw/2)+'" y="'+T+'" width="'+pw+'" height="'+(H-T-B)+'" data-t="'+esc("<b>"+num(x.n)+" "+data(x.d)+"</b><br>"+mln(x.pesati)+" mln di token pesati<br>"+it(x.richieste,0)+" richieste"+(x.durata_min!=null?" · "+x.durata_min+" min":""))+'"/>'
     +'<path class="col'+(i==S.length-1?" ultima":"")+'" d="M'+(cx-bw/2)+" "+(H-B)+"V"+(y+r)+"q0 -"+r+" "+r+" -"+r+"H"+(cx+bw/2-r)+"q"+r+" 0 "+r+" "+r+"V"+(H-B)+'z"/>';
    if(i%ogni==0||i==S.length-1)g+='<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle">'+data(x.d).slice(4)+"</text>"});
  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" stroke="var(--ink)" stroke-width="1"/>';
  h+='<section class="sec"><div class="sec-head"><h2>Token pesati per edizione</h2><span>milioni · ultime '+S.length+" · in scuro l'ultima</span></div>"
   +'<div class="card"><svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Token pesati per edizione, in milioni. I valori sono nella tabella in fondo alla pagina.">'+g+"</svg></div></section>";

  /* 2. dove vanno: grandezze a confronto, una tinta, etichette in chiaro */
  var q=[];Object.keys(u.quote||{}).forEach(function(k){q.push([NOMI[k]||k,u.quote[k],""])});
  Object.keys(u.connettori||{}).forEach(function(k){var c=(u.chiamate||{})[k];q.push(["Connettore "+k,u.connettori[k],c!=null?c+" chiamate":""])});
  var w=(u.chiamate||{}).WebSearch,f=(u.chiamate||{}).WebFetch;
  q.forEach(function(x){if(x[0]==NOMI.web&&(w!=null||f!=null))x[2]=(w||0)+" ricerche, "+(f||0)+" pagine"});
  q=q.filter(function(x){return x[1]>0}).sort(function(a,b){return b[1]-a[1]});
  if(q.length){var mx=q[0][1];
    h+='<section class="sec"><div class="sec-head"><h2>Dove vanno i token</h2><span>'+num(u.n)+" "+data(u.d)+' · quota del consumo, stima del sistema</span></div><div class="card"><div class="righe">'
     +q.map(function(x){return '<div class="r"><div>'+esc(x[0])+(x[2]?' <small style="color:var(--muted)">· '+esc(x[2])+"</small>":"")+'</div><div class="b"><i style="width:'+(x[1]/mx*100)+'%"></i></div><div class="p">'+it(x[1],1)+"%</div></div>"}).join("")
     +"</div></div></section>"}

  /* 3. la tabella: tutti i valori, per chi non guarda il grafico */
  var righe=reg.slice(-20).reverse().map(function(x){var i=reg.indexOf(x),p=i>0?reg[i-1]:null;
    return "<tr><td>"+data(x.d)+" "+num(x.n)+"</td><td>"+mln(x.pesati)+"</td><td>"+seg(p?vari(x.pesati,p.pesati):null)+"</td><td>"+it(x.richieste,0)+"</td><td>"+(x.ora||"-")+"</td><td>"+(x.durata_min!=null?x.durata_min+" min":"-")+"</td><td>"+mln(x.token.cacheRead)+"</td><td>"+mln(x.token.cacheWrite)+"</td><td>"+it(x.token.output/1e3,0)+"</td></tr>"}).join("");
  h+='<section class="sec"><div class="sec-head"><h2>Edizione per edizione</h2><span>ultime '+Math.min(20,reg.length)+'</span></div><div class="tw"><table><thead><tr><th>Edizione</th><th>Pesati (mln)</th><th>Var.</th><th>Richieste</th><th>Uscita</th><th>Durata</th><th>Letti cache (mln)</th><th>Scritti cache (mln)</th><th>In uscita (mila)</th></tr></thead><tbody>'+righe+"</tbody></table></div>"
   +'<p class="note">Token pesati = ingresso + 2 x scritti in cache + 0,1 x letti dalla cache + 5 x in uscita: è il peso con cui il sistema conta il consumo. La quota per voce è una stima, perché il consumo è misurato per richiesta e non per strumento. Il passo che registra la misura non è contato.</p></section>';
  app.innerHTML=h;
  app.addEventListener("pointermove",function(e){var t=e.target.getAttribute&&e.target.getAttribute("data-t");if(!t){tip.style.opacity=0;return}
    tip.innerHTML=t;tip.style.opacity=1;var x=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8),y=e.clientY-tip.offsetHeight-12;tip.style.left=x+"px";tip.style.top=(y<8?e.clientY+16:y)+"px"});
  app.addEventListener("pointerleave",function(){tip.style.opacity=0});
  app.addEventListener("focusin",function(e){var t=e.target.getAttribute&&e.target.getAttribute("data-t");if(!t)return;var b=e.target.getBoundingClientRect();tip.innerHTML=t;tip.style.opacity=1;tip.style.left=Math.min(b.left,innerWidth-tip.offsetWidth-8)+"px";tip.style.top=Math.max(8,b.top-tip.offsetHeight-6)+"px"});
  app.addEventListener("focusout",function(){tip.style.opacity=0});
}})();
</script>
</body>
</html>
