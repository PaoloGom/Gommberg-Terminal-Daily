<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro dei lavori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: asciutta, da direttore: decisioni prima, il resto dietro.
   IDEA: il registro di bottega, un foglio con le voci in fila.
   PICTURE: la lista stessa, in alto, senza ornamenti.
   COLOUR and TYPE: carta chiara, inchiostro, un arancione scuro per ciò che tocca a te, blu per ciò che lavora; Inter.
   LAYOUT: una colonna fino a 1040px, righe che vanno a capo sul telefono. */
:root{color-scheme:light dark;
--bg:light-dark(#F5F4F0,#15140F);--card:light-dark(#FFFFFF,#1F1E19);--soft:light-dark(#FAF9F6,#26251F);
--ink:light-dark(#1A1A1A,#EDEBE5);--muted:light-dark(#55524B,#B5B1A7);--line:light-dark(#DAD7CF,#3A3830);--line2:light-dark(#EFEDE7,#2C2B25);
--acc:light-dark(#B23A0A,#C2410C);--acc-t:light-dark(#8A2F0B,#F4A57A);--blu:light-dark(#1E3A8A,#9DB8F5);
--sola-bg:light-dark(#E3EAF8,#1E2A48);--sola-fg:light-dark(#1E3A8A,#C7D6F7);--via-bg:light-dark(#FCE7D2,#4A2412);--via-fg:light-dark(#8A2F0B,#F7C9A8);
--tab:light-dark(#E7E4DC,#2A2923);--bordo:light-dark(#B9B5AA,#4A473E)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
a{color:var(--acc-t)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 56px;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.eyebrow{font-size:13px;font-weight:600;color:var(--acc-t)}
h1{margin:0;font-size:28px;font-weight:700;line-height:1.1}
h2{margin:0;font-size:20px;font-weight:700}
.testa{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;justify-content:space-between}
.testa .sub{flex:1 1 260px}
.sub,.piccolo{font-size:14px;color:var(--muted)}
.piccolo{font-size:13px}
.pill{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px}
.tabs{display:flex;flex-wrap:wrap;background:var(--tab);border-radius:10px;padding:4px;gap:4px}
.tabs button{border:0;border-radius:7px;padding:9px 16px;min-height:44px;font-size:14px;font-weight:600;background:transparent}
.tabs button[aria-pressed=true]{background:var(--card)}
section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card.tratteggio{border-style:dashed;border-color:var(--bordo)}
.lista{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 20px}
.riga{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.lista>div:last-child,.lista>div:last-child .riga{border-bottom:0}
.cod{font-size:13px;font-weight:600;color:var(--muted);width:44px;flex:none}
.tit{flex:999 1 280px;font-weight:500}
.stato{font-size:14px;font-weight:600;color:var(--muted)}
.stato.blu{color:var(--blu)}.stato.accento{color:var(--acc-t)}
.apri{flex:999 1 300px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;text-align:left;background:transparent;border:0;padding:8px 0;min-height:44px}
.apri.tutta{width:100%;flex:1 1 100%}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip.sola{background:var(--sola-bg);color:var(--sola-fg)}.chip.via{background:var(--via-bg);color:var(--via-fg)}.chip.visto{background:var(--ink);color:var(--bg)}
.chip.prio{border:1px solid var(--ink)}.chip.max{background:var(--ink);color:var(--bg)}.chip.high{background:var(--via-bg);color:var(--ink)}.chip.idea{color:var(--muted);border-color:var(--muted)}
.chip.nero{background:var(--ink);color:var(--bg)}
.griglia{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px}
.et{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
.multi{white-space:pre-line}
.scheda{background:var(--soft);border-radius:10px;padding:16px;margin:0 0 12px;display:flex;flex-direction:column;gap:14px}
.azioni{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border-radius:10px;padding:10px 16px;min-height:44px;font-size:15px;font-weight:600;border:1px solid var(--bordo);background:transparent;text-decoration:none;display:inline-flex;align-items:center;color:var(--ink)}
.btn.primario{border:0;background:var(--acc);color:#FFFFFF;font-weight:700}
.btn.secondo{background:var(--card);border-color:var(--ink)}
.btn.margine{background:var(--card);border:2px solid var(--acc);color:var(--acc-t);font-weight:700}
.btn.nero{border:0;background:var(--ink);color:var(--bg)}
.btn.link{border:0;padding:8px 0;color:var(--acc-t);text-decoration:underline;font-size:14px}
.btn[disabled]{opacity:.55;cursor:default}
.seg{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.seg button{border:1px solid var(--ink);border-radius:999px;padding:8px 14px;min-height:44px;font-size:14px;font-weight:600;background:var(--card)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.campo{flex:999 1 260px;border:1px solid var(--bordo);border-radius:10px;padding:12px 14px;min-height:48px;font-size:16px;background:var(--card)}
.campo.corto{flex:0 1 120px}
.esito{font-weight:600;color:var(--blu)}
.errore{font-weight:600;color:var(--acc-t)}
.legenda{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legenda b{color:var(--ink)}
.avviso{background:var(--via-bg);color:var(--via-fg);border-radius:10px;padding:12px 16px;font-weight:600}
.nascosto{position:absolute;left:-9999px}
.quattro{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;align-items:start}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
.vuoto{color:var(--muted);padding:14px 0}
</style>
</head>
<body>
<div class="wrap">
<header>
<div><div class="eyebrow">Gommberg Terminal Daily</div><h1>Registro dei lavori</h1></div>
<div class="azioni">
<div class="pill" id="salute-pill"><span id="salute-testo">Leggo lo stato della macchina...</span></div>
<nav class="tabs" aria-label="Viste">
<button type="button" data-vista="oggi" aria-pressed="true">Oggi</button>
<button type="button" data-vista="tutti" aria-pressed="false">Tutti i lavori</button>
<button type="button" data-vista="dietro" aria-pressed="false">Dietro le quinte</button>
</nav>
</div>
</header>
<div id="avviso" class="avviso" role="status" hidden></div>
<main id="app"></main>
</div>
<script>
{
/* ===== Logica pura: nessun accesso al DOM. Si prova con prova.mjs. ===== */
const Registro = (() => {
  // Nomi del connettore da provare, in ordine (non si sa ancora quale funziona)
  const NOMI_CONNETTORE = ["Claude Code Remote", "Claude_Code_Remote"];
  // Unico punto da cambiare se il parametro ?q= non funziona
  function chatURL(codice) { return "https://claude.ai/new?q=" + encodeURIComponent("Gommberg, voce " + codice + ": "); }

  const PRIO = { max: "Max", high: "High", medium: "Medium", low: "Low", tbd: "Idea" };
  const PRIO_R = { max: 0, high: 1, medium: 2, low: 3, tbd: 4 };
  const PRIO_VECCHIA = { 1: "high", 2: "medium", 3: "low" };
  const LIVELLI = { sola: "Da sola", via: "Con il tuo via", visto: "Via + Visto" };
  const LIVELLO_SPIEGA = { sola: "parte e va in linea da sola, leggi l'esito.", via: "parte con il tuo clic, poi fa da sé.", visto: "prima di andare in linea te la mostro." };
  const SFORZO = { low: "sforzo basso", medium: "sforzo medio", high: "sforzo alto", xhigh: "sforzo molto alto", max: "sforzo massimo" };
  const STATI_VOCE = ["da-fare", "in-corso", "pronta", "fatta"];
  const SERATE_APERTE = ["preparata", "partita", "pronta", "con-prova", "in-rilascio"];
  const TIPI = { "via-piano": "Via al piano", ok: "Ok, in linea", "non-ancora": "Non ancora", togli: "Togli", margine: "Usa il margine", appunto: "Appunto", indietro: "Torna indietro" };
  const SENZA_LANCIO = ["togli", "appunto"];
  const ERR_ALTRO_NOME = ["server_not_connected", "not_in_manifest", "server_not_found"];
  const ERR_INCERTO = ["server_unavailable", "upstream_error"];

  /* Stati detti a Paolo: la mappa dagli stati del database sta tutta qui (statoVoce). */
  const STATI = {
    tu: { testo: "Tocca a te", tono: "accento" },
    ferma: { testo: "Ferma", tono: "accento" },
    lavoro: { testo: "Al lavoro", tono: "blu" },
    coda: { testo: "In coda", tono: "" },
    prova: { testo: "Aspetta la prova", tono: "" },
    piano: { testo: "In piano", tono: "" },
    avanti: { testo: "Più avanti", tono: "" },
    idea: { testo: "Idea", tono: "" },
    fatta: { testo: "Fatta", tono: "" }
  };
  const ORDINE_LAVORO = { lavoro: 0, ferma: 1, coda: 2, prova: 3 };

  const GG = ["dom", "lun", "mar", "mer", "gio", "ven", "sab"];
  const pad = n => String(n).padStart(2, "0");
  const txt = x => (x == null ? "" : String(x).trim());
  const lista = x => (Array.isArray(x) ? x.map(txt).filter(Boolean) : []);
  const oggetti = x => (Array.isArray(x) ? x.filter(v => v && typeof v === "object") : []);
  const giornoOk = s => (/^\d{4}-\d{2}-\d{2}$/.test(s || "") ? s : "");
  const https = s => (/^https:\/\//.test(txt(s)) ? txt(s) : "");
  function dataLocale(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function isoGiorno(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function giornoBreve(s) { const d = dataLocale(s); return d ? GG[d.getDay()] + " " + d.getDate() + "/" + (d.getMonth() + 1) : ""; }
  function quandoTesto(t, ora) {
    const d = new Date(t); if (!t || isNaN(d)) return "";
    const hm = pad(d.getHours()) + ":" + pad(d.getMinutes()), g = isoGiorno(d), o = isoGiorno(ora);
    if (g === o) return "oggi alle " + hm;
    const ieri = new Date(ora); ieri.setDate(ieri.getDate() - 1);
    if (g === isoGiorno(ieri)) return "ieri alle " + hm;
    return GG[d.getDay()] + " " + d.getDate() + "/" + (d.getMonth() + 1) + " alle " + hm;
  }
  const numCodice = c => { const n = parseInt(String(c).replace(/\D/g, ""), 10); return isNaN(n) ? 9999 : n; };

  function normVoce(id, d) {
    d = d || {};
    const titolo = txt(d.titolo) || txt(d.codice) || id;
    const prio = d.stato === "idea" ? "tbd" : (PRIO[d.priorita] ? d.priorita : (PRIO_VECCHIA[Number(d.priorita)] || "medium"));
    const ord = Number(d.ordine);
    return {
      id, codice: txt(d.codice) || id, titolo,
      cosa: txt(d.cosa) || titolo,
      lettore: txt(d.lettore) || "Da scrivere",
      perche: txt(d.obiettivo), decisioni: txt(d.decisioni), domanda: txt(d.domanda),
      stato: STATI_VOCE.includes(d.stato) ? d.stato : "da-fare",
      priorita: prio,
      livello: LIVELLI[d.livello] ? d.livello : "visto",
      riserva: d.riserva === true,
      ordine: d.ordine !== "" && d.ordine != null && isFinite(ord) ? ord : 999,
      giorno: giornoOk(d.giorno), chiusa: giornoOk(d.chiusa),
      finestra: txt(d.finestra), modello: txt(d.modello), sforzo: txt(d.sforzo),
      ferma: txt(d.ferma), anteprima: https(d.anteprima)
    };
  }

  function righeSerata(s) { return oggetti(s && s.dopo && s.dopo.righe).concat(oggetti(s && s.prima && s.prima.righe)); }

  /* raw: {tasks, serate, clic, appunti, rilasci: oggetti id -> dati; salute, piano, capo: dati o null} */
  function contesto(raw, ora) {
    raw = raw || {};
    const voci = Object.entries(raw.tasks || {}).map(([id, d]) => normVoce(id, d));
    const perCodice = new Map(voci.map(v => [v.codice, v]));
    const clic = Object.entries(raw.clic || {}).map(([id, d]) => ({ id, ...(d || {}) }))
      .sort((a, b) => txt(b.quando).localeCompare(txt(a.quando)));
    const serate = Object.entries(raw.serate || {}).map(([id, d]) => ({ id, ...(d || {}) })).sort((a, b) => b.id.localeCompare(a.id));
    // Le voci di una serata che aspetta la prova (ramo con prova)
    const prova = new Map();
    serate.filter(s => s.stato === "con-prova").forEach(s => {
      const p = (s.dopo && s.dopo.prova) || {};
      righeSerata(s).forEach(r => { const c = txt(r.codice); if (c && !prova.has(c)) prova.set(c, { giorno: giornoOk(p.giorno), esito: txt(p.esito), nota: txt(p.nota) }); });
    });
    const p = raw.piano;
    const piano = p && txt(p.settimana) ? { settimana: txt(p.settimana), titolo: txt(p.titolo), voci: lista(p.voci), tolte: lista(p.tolte), via: p.via || null } : null;
    const appunti = Object.entries(raw.appunti || {}).map(([id, d]) => ({ id, ...(d || {}) }))
      .filter(a => (a.stato || "nuovo") === "nuovo" && txt(a.testo)).sort((a, b) => txt(b.creato).localeCompare(txt(a.creato)));
    return { ora: ora || new Date(), voci, perCodice, clic, serate, prova, piano, appunti, salute: raw.salute || null, rilasci: raw.rilasci || {}, capo: raw.capo || null };
  }

  // Il clic più recente non ancora eseguito dal capo sviluppo
  function clicAperto(ctx, tipi, chiave) {
    tipi = [].concat(tipi);
    return ctx.clic.find(c => tipi.includes(c.tipo) && c.esito === "da-eseguire" && (chiave == null || c.voce === chiave || c.piano === chiave)) || null;
  }
  function pianoPartito(ctx) { return !!(ctx.piano && (ctx.piano.via || clicAperto(ctx, "via-piano", ctx.piano.settimana))); }
  const inPiano = (ctx, c) => !!(ctx.piano && ctx.piano.voci.includes(c) && !ctx.piano.tolte.includes(c));
  const daVedere = v => v.stato === "pronta" && !!v.domanda;

  function st(chiave, causa) { return { chiave, testo: STATI[chiave].testo, tono: STATI[chiave].tono, causa: causa || "" }; }
  function statoVoce(v, ctx) {
    if (v.stato === "fatta") return st("fatta");
    if (v.ferma) return st("ferma", v.ferma);
    const p = ctx.prova.get(v.codice);
    if (p && p.esito === "ko") return st("ferma", "La prova non è andata bene" + (p.nota ? ": " + p.nota : ""));
    if (p) return st("prova", p.giorno ? "prova di " + giornoBreve(p.giorno) : "");
    if (daVedere(v) || v.domanda) return st("tu");
    if (v.stato === "in-corso") return st("lavoro");
    if (v.stato === "pronta" || clicAperto(ctx, ["ok", "non-ancora"], v.codice)) return st("coda");
    if (inPiano(ctx, v.codice)) return pianoPartito(ctx) ? st("coda", v.giorno ? giornoBreve(v.giorno) : "") : st("piano");
    if (v.riserva && clicAperto(ctx, "margine")) return st("coda", "con la riserva");
    if (v.priorita === "tbd") return st("idea");
    return st("avanti");
  }

  function comeSiLavora(v) {
    const parti = [v.modello || "Opus", SFORZO[v.sforzo] || ""].filter(Boolean);
    return parti.join(", ");
  }

  function statoClic(c, ora) {
    if (!c) return null;
    const l = c.lancio || {};
    if (l.esito === "partito") {
      const t = new Date(l.quando || c.quando), fresco = !isNaN(t) && ora - t < 5 * 60000;
      return { tipo: "partito", testo: fresco ? "Partito adesso." : "Partito " + quandoTesto(l.quando || c.quando, ora) + "." };
    }
    if (l.esito === "incerto") return { tipo: "incerto", testo: "Non so se è partito: la risposta non è arrivata.", riprova: true };
    return { tipo: "coda", testo: "In coda: parte al prossimo giro." };
  }

  function zoneOggi(ctx) {
    const voci = ctx.voci.map(v => ({ v, s: statoVoce(v, ctx) }));
    let piano = null;
    if (ctx.piano && !ctx.piano.via) {
      const pc = ctx.piano;
      piano = {
        settimana: pc.settimana, titolo: pc.titolo || "Piano della settimana dal " + giornoBreve(pc.settimana),
        clic: clicAperto(ctx, "via-piano", pc.settimana),
        voci: pc.voci.filter(c => !pc.tolte.includes(c)).map(c => {
          const v = ctx.perCodice.get(c) || normVoce(c, { codice: c, titolo: "Voce non trovata nel Registro" });
          return { v, quando: v.giorno ? giornoBreve(v.giorno) : "da fissare", togli: clicAperto(ctx, "togli", c) };
        })
      };
    }
    const vedere = voci.filter(x => x.s.chiave === "tu" && daVedere(x.v)).map(x => ({ v: x.v, clic: clicAperto(ctx, ["ok", "non-ancora"], x.v.codice) }));
    const domande = voci.filter(x => x.s.chiave === "tu" && !daVedere(x.v)).map(x => x.v);
    const riserva = ctx.voci.filter(v => v.riserva && v.stato !== "fatta").sort((a, b) => a.ordine - b.ordine || numCodice(a.codice) - numCodice(b.codice));
    const lavoro = voci.filter(x => x.s.chiave in ORDINE_LAVORO)
      .sort((a, b) => ORDINE_LAVORO[a.s.chiave] - ORDINE_LAVORO[b.s.chiave] || a.v.ordine - b.v.ordine || numCodice(a.v.codice) - numCodice(b.v.codice));
    const rilasci = oggetti(ctx.salute && ctx.salute.rilasci).slice(0, 3).map(r => ({
      nome: txt(r.nome) || "Rilascio", quando: quandoTesto(r.quando, ctx.ora), esito: txt(r.esito),
      lettore: txt(r.lettore),
      verificato: typeof r.verificato === "boolean" ? r.verificato : /verificat\w* dal vivo/i.test(txt(r.testo))
    }));
    const ultimo = rilasci.find(r => r.esito === "ok") || null;
    return {
      piano, vedere, domande, riserva, lavoro, rilasci, ultimo,
      margine: clicAperto(ctx, "margine"), indietro: clicAperto(ctx, "indietro"),
      niente: !piano && !vedere.length && !domande.length,
      appunti: ctx.appunti
    };
  }

  const FILTRI = {
    aperte: (v, s) => s.chiave !== "fatta" && s.chiave !== "idea",
    idee: (v, s) => s.chiave === "idea",
    fatte: (v, s) => s.chiave === "fatta",
    riserva: (v, s) => v.riserva && s.chiave !== "fatta"
  };
  const ORDINI = {
    priorita: (a, b) => PRIO_R[a.priorita] - PRIO_R[b.priorita] || a.ordine - b.ordine || numCodice(a.codice) - numCodice(b.codice),
    lavoro: (a, b) => a.ordine - b.ordine || PRIO_R[a.priorita] - PRIO_R[b.priorita] || numCodice(a.codice) - numCodice(b.codice)
  };
  function elenco(ctx, ordine, filtro) {
    const f = FILTRI[filtro] || FILTRI.aperte, o = ORDINI[ordine] || ORDINI.priorita;
    return ctx.voci.map(v => ({ v, s: statoVoce(v, ctx) })).filter(x => f(x.v, x.s)).sort((a, b) => o(a.v, b.v))
      .map((x, i) => ({ ...x, pos: i + 1, quando: x.s.chiave === "fatta" ? giornoBreve(x.v.chiusa) : giornoBreve(x.v.giorno) }));
  }
  const nAperte = ctx => elenco(ctx, "priorita", "aperte").length;

  function dietro(ctx) {
    const s = ctx.salute || {};
    const ver = new Date(s.verificato);
    const vecchia = !s.verificato || isNaN(ver) || ctx.ora - ver > 26 * 3600000;
    const rilasci = oggetti(s.rilasci).map(r => ({ nome: txt(r.nome), quando: quandoTesto(r.quando, ctx.ora), esito: txt(r.esito), testo: txt(r.testo) }))

            h("div", { class: "griglia" }, campo("Decisioni prese", v.decisioni || "Nessuna ancora", true), campo("Come si lavora", R.comeSiLavora(v)),
              h("div", null, h("div", { class: "et" }, "Controllo"), chipLivello(v), h("div", { class: "piccolo", testo: R.LIVELLO_SPIEGA[v.livello] }))),
            x.s.causa ? h("div", { class: "sub", testo: x.s.testo + ": " + x.s.causa }) : null,
            h("div", { class: "azioni" }, chatLink(v), h("span", { class: "piccolo" }, "Si apre una chat nuova con il codice della voce: chiedi quello che vuoi, o cambia rotta."))) : null);
      }) : h("div", { class: "vuoto", testo: "Nessuna voce qui." })))];
  }

  function vistaDietro(ctx) {
    const d = R.dietro(ctx);
    const SAL = { ok: "Ok", ko: "Guasto", attesa: "In attesa" };
    const box = (tit, ...c) => h("div", { class: "card", style: "padding:18px;gap:10px" }, h("div", { style: "font-weight:700", testo: tit }), c);
    const riga = (a, b) => h("div", { style: "border-top:1px solid var(--line2);padding-top:8px" }, a, b ? h("div", { class: "piccolo multi", testo: b }) : null);
    return [h("section", null,
      h("div", { class: "testa" }, h("h2", null, "Dietro le quinte"), h("span", { class: "sub" }, "Il banco del capo sviluppo. Non serve per decidere: è qui se vuoi approfondire.")),
      h("div", { class: "quattro" },
        box("Salute della macchina",
          h("div", { class: d.vecchia ? "errore" : "piccolo", testo: d.verificato ? "Verificata " + d.verificato + (d.vecchia ? ": più di 26 ore fa." : ".") : "Nessuna verifica registrata." }),
          d.righe.map(r => riga(h("div", null, h("b", { testo: (r.nome || "") + ": " }), h("span", { class: r.stato === "ok" ? "" : "errore", testo: SAL[r.stato] || r.stato || "" })),
            [r.testo, r.causa ? "Causa: " + r.causa : "", r.rimedio ? "Rimedio: " + r.rimedio : ""].filter(Boolean).join("\n")))),
        box("Storico dei rilasci", d.rilasci.length ? d.rilasci.map(r => riga(h("b", { testo: r.nome }), [r.quando, r.esito, r.testo].filter(Boolean).join(" - "))) : h("div", { class: "piccolo" }, "Nessun rilascio.")),
        box("Registro dei consensi",
          h("div", { class: "piccolo", testo: Object.keys(d.conta).length ? Object.entries(d.conta).map(([t, n]) => (R.TIPI[t] || t) + ": " + n).join(" · ") : "Ancora nessun clic dalla pagina nuova." }),
          d.consensi.slice(0, 40).map(c => riga(h("div", null, h("b", { testo: c.tipo }), c.voce ? " " + c.voce : ""),
            [c.quando, c.testo ? "\"" + c.testo + "\"" : "", "lancio: " + (c.lancio || "non provato"), "esito: " + (c.esito || "?") + (c.nota ? " (" + c.nota + ")" : "")].filter(Boolean).join(" - ")))),
        box("Serate (storico)", d.serate.map(s => h("details", { style: "border-top:1px solid var(--line2)" },
          h("summary", { testo: s.id + " - " + s.stato + (s.ramo ? " (" + s.ramo + ")" : "") }),
          h("div", { class: "piccolo multi", testo: [s.righe.join("\n"), s.nota, s.fine].filter(Boolean).join("\n\n") })))))
    )];
  }

  function vai(v) { ui.vista = v; try { history.replaceState(null, "", "#" + v); } catch (_) { location.hash = v; } disegna(); window.scrollTo(0, 0); }

  function disegna() {
    const ctx = R.contesto(raw, new Date());
    document.querySelectorAll("[data-vista]").forEach(b => {
      b.setAttribute("aria-pressed", String(b.dataset.vista === ui.vista));
      if (b.dataset.vista === "tutti") b.textContent = "Tutti i lavori · " + R.nAperte(ctx);
    });
    const ed = raw.salute && (raw.salute.righe || []).find(r => r && r.nome === "Edizione");
    $("#salute-testo").textContent = !caricato ? "Leggo lo stato della macchina..." : ed ? (ed.stato === "ok" ? "Edizione: " : "Edizione da guardare: ") + (ed.testo || "") : "Stato della macchina non ancora scritto";
    const f = document.activeElement, fid = f && f.id && app.contains(f) ? f.id : null;
    const sel = fid && typeof f.selectionStart === "number" ? [f.selectionStart, f.selectionEnd] : null;
    const viste = { oggi: vistaOggi, tutti: vistaTutti, dietro: vistaDietro };
    app.replaceChildren(h("div", { style: "display:flex;flex-direction:column;gap:28px" }, caricato ? viste[ui.vista](ctx) : h("div", { class: "sub" }, "Carico il Registro...")));
    if (fid) { const n = document.getElementById(fid); if (n) { n.focus({ preventScroll: true }); if (sel) try { n.setSelectionRange(sel[0], sel[1]); } catch (_) {} } }
  }
  function avviso(t) { const a = $("#avviso"); a.textContent = t; a.hidden = !t; }

  document.querySelectorAll("[data-vista]").forEach(b => b.addEventListener("click", () => vai(b.dataset.vista)));
  const leggiHash = () => { const x = location.hash.slice(1); if (["oggi", "tutti", "dietro"].includes(x)) { ui.vista = x; disegna(); } };
  window.addEventListener("hashchange", leggiHash);
  { const x = location.hash.slice(1); if (["oggi", "tutti", "dietro"].includes(x)) ui.vista = x; }
  disegna();

  (async () => {
    const usa = async n => { try { return window.claude && window.claude.use ? await window.claude.use(n) : null; } catch (_) { return null; } };
    const timer = setTimeout(() => { if (!caricato) avviso("Non riesco ancora a leggere il Registro. La pagina si aggiorna da sola appena risponde."); }, 10000);
    db = await usa("db");
    if (!db) { clearTimeout(timer); caricato = true; avviso("Per vedere e decidere apri questa pagina su claude.ai con il tuo account."); disegna(); return; }
    usa("mcp").then(m => { mcp = m; });
    usa("user").then(async u => { try { if (u && u.can && (await u.can("data.write")) === false) { puoScrivere = false; disegna(); } } catch (_) {} });
    const coll = (nome, chiave) => db.collection(nome).onSnapshot(s => {
      const m = {}; s.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); }); raw[chiave] = m;
      if (nome === "tasks" && !s.metadata.fromCache) { clearTimeout(timer); avviso(""); }
      if (nome === "tasks") caricato = true;
      disegna();
    }, e => { if (nome === "tasks") { clearTimeout(timer); caricato = true; avviso(e && e.code === "revoked" ? "Questa pagina non ha più accesso ai dati." : "Non riesco a leggere il Registro adesso. Riapri la pagina più tardi."); disegna(); } });
    const doc = (path, chiave) => db.doc(path).onSnapshot(s => { raw[chiave] = s.exists ? s.data() : null; disegna(); }, () => {});
    coll("tasks", "tasks"); coll("serate", "serate"); coll("clic", "clic"); coll("appunti", "appunti"); coll("rilasci", "rilasci");
    doc("meta/salute", "salute"); doc("meta/piano", "piano");
  })();
}
if (typeof document !== "undefined" && document.getElementById("app")) avvia();
}
</script>
</body>
</html>
