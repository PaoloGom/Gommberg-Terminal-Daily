<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pannello di controllo - Gommberg Terminal Daily</title>
<meta name="theme-color" content="#0E0E0E">
<link rel="icon" href="../assets/icona.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#EFEDE8;--sheet:#FFFFFF;--ink:#141414;--muted:#6B655E;--rule:#DEDAD4;--panel:#F1EEE9;--orange:#F26B1D;--mark:#D9560B;
--up:#157A3E;--down:#C0271D;--warn:#A86A00;--bar:#0E0E0E;--bar-ink:#F5F3EF;
--display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;--body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--paper:#0F0E0D;--sheet:#1A1816;--ink:#EDEAE5;--muted:#A49E96;--rule:#2E2B28;--panel:#242120;--orange:#FF7A2E;--mark:#E8691E;--up:#4CC27A;--down:#FF6B5E;--warn:#E0A93B;--bar:#050505;color-scheme:dark}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
@media (max-width:760px){.wrap{padding-inline:10px}}
.top{background:var(--bar);color:var(--bar-ink)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:46px}
.logo{font-family:var(--display);font-stretch:85%;font-weight:900;font-size:16px;text-decoration:none;color:var(--bar-ink);white-space:nowrap}
.logo b{color:var(--orange)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;align-self:stretch}
.tabs::-webkit-scrollbar,.filtri .wrap::-webkit-scrollbar{display:none}
.tabs button{font:500 13px var(--body);color:#B9B3AA;background:none;border:0;border-bottom:3px solid transparent;padding:0 12px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--bar-ink)}
.tabs button[aria-selected=true]{color:var(--bar-ink);border-bottom-color:var(--orange)}
@media (max-width:760px){.top .wrap{flex-direction:column;align-items:flex-start;gap:0;padding-top:8px}.tabs{width:100%;height:36px}.tabs button{padding:0 10px}}
.filtri{background:var(--sheet);border-bottom:1px solid var(--rule)}
.filtri .wrap{display:flex;gap:18px;align-items:center;padding-block:7px;overflow-x:auto;scrollbar-width:none}
.f{display:flex;gap:4px;align-items:center;font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.f button,.sel button{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:3px 9px;cursor:pointer}
.f button[aria-pressed=true],.sel button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sel button:disabled{color:var(--muted);cursor:default;opacity:.6}
.f.agg{margin-left:auto}
main{padding-block:12px 28px}
.griglia{display:grid;gap:10px}
.c5{grid-template-columns:repeat(5,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}.c21{grid-template-columns:minmax(0,2.1fr) minmax(0,1fr)}
@media (max-width:980px){.c5{grid-template-columns:repeat(3,minmax(0,1fr))}.c21{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.c5,.c4{grid-template-columns:repeat(2,minmax(0,1fr))}.c5>.k:first-child{grid-column:span 2}.k .l{flex-direction:column;gap:0}.k .v{font-size:25px}}
.k,.vis{background:var(--sheet);border:1px solid var(--rule);border-radius:4px}
.k{padding:9px 12px 10px;border-left:4px solid var(--rule);text-align:left;font:inherit;color:inherit;display:block;width:100%;min-width:0}
button.k{cursor:pointer}button.k:hover{background:var(--panel)}
.k.ok{border-left-color:var(--up)}.k.att{border-left-color:var(--warn)}.k.ko{border-left-color:var(--down)}
.k[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:-2px}
.k .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.k .l span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k .v{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:28px;line-height:1.1;margin-top:4px;white-space:nowrap}
.k .v small{font-size:13px;font-weight:600;color:var(--muted)}
.k .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{white-space:nowrap}.st.ok{color:var(--up)}.st.att{color:var(--warn)}.st.ko{color:var(--down)}
.vis{padding:10px 12px;min-width:0}
.vis h3{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.sel{display:flex;gap:4px;font-family:var(--mono);font-size:11px;text-transform:none;letter-spacing:0}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.grid{stroke:var(--rule);stroke-width:1}
.col{fill:var(--mark);pointer-events:none}
.col.stima{fill:url(#trat);stroke:var(--mark);stroke-width:1}
.col.tardi{fill:var(--down)}
.hit{fill:transparent}.hit:hover+.col,.hit:focus+.col{opacity:.7}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px;background:var(--mark)}
.leg i.stima{background:repeating-linear-gradient(135deg,var(--mark) 0 2px,transparent 2px 5px);outline:1px solid var(--mark);outline-offset:-1px}
.leg i.tardi{background:var(--down)}
.avv{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.avv button{display:flex;justify-content:space-between;gap:8px;width:100%;font:inherit;color:inherit;background:none;border:0;border-left:3px solid var(--rule);padding:5px 8px;cursor:pointer;text-align:left}
.avv button:hover{background:var(--panel)}
.avv .ok{border-left-color:var(--up)}.avv .att{border-left-color:var(--warn)}.avv .ko{border-left-color:var(--down)}
.avv b{font-family:var(--mono);font-weight:500;white-space:nowrap}
.avv .st{font-family:var(--mono);font-size:11px}
.su{color:var(--up)}.giu{color:var(--down)}
.tw{overflow:auto;max-height:68vh}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 9px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
th{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--ink);background:var(--sheet);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
td{font-variant-numeric:tabular-nums}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--panel)}tr.on td{background:var(--panel);font-weight:600}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:0 6px;border-radius:9px;border:1px solid var(--rule);color:var(--muted)}
.tag.m{border-color:var(--ink);color:var(--ink)}
.metro .b{height:14px;background:var(--panel);border-radius:3px;overflow:hidden;position:relative}
.metro .b i{display:block;height:100%;background:var(--mark)}
.metro .b u{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.metro .l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}
.grande{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:30px;line-height:1.1}
.grande small{font-size:13px;font-weight:600;color:var(--muted)}
.note{font-size:13px;color:var(--muted);max-width:90ch}.note p{margin:0 0 10px}.note h3{margin-top:4px}
.vuoto{background:var(--sheet);border:1px dashed var(--rule);padding:24px;color:var(--muted)}
#tip{position:fixed;z-index:9;pointer-events:none;background:var(--bar);color:var(--bar-ink);font-size:12.5px;line-height:1.35;padding:7px 9px;border-radius:4px;opacity:0;transition:opacity .08s;max-width:250px}
#tip b{font-weight:600}
</style>
</head>
<body>
<div class="top"><div class="wrap"><a class="logo" href="../"><b>GOMMBERG</b> TERMINAL DAILY</a><div class="tabs" role="tablist" id="tabs"></div></div></div>
<div class="filtri"><div class="wrap" id="filtri"></div></div>
<main class="wrap"><div id="app"></div></main>
<div id="tip" role="status"></div>
<script>
(function(){
/* Soglie: verde fino alla prima, giallo fino alla seconda, rosso oltre. RIF = il piano a cui si rapporta il consumo. */
var RIF="Pro",S={uscita:"09:45",punt:[90,75],consumo:[25,35],fr:[18,21],lunghe:[10,15],prim:[40,25],schede:[25,18]};
var PAG=[["panoramica","Panoramica"],["operativita","Operatività"],["consumo","Consumo"],["qualita","Qualità"],["versioni","Versioni"],["edizioni","Edizioni"],["metodo","Metodo"]];
/* misura: [nome, soglia, meglio se bassa, unità, decimali] */
var MQ={fr:["Parole per frase",S.fr,1,"",1],lunghe:["Frasi oltre 30 parole",S.lunghe,1,"%",0],prim:["Fonti primarie",S.prim,0,"%",0],schede:["Schede dei fatti",S.schede,0,"",0]};
var st0={p:"panoramica",per:10,v:"",mq:"fr",un:"pt"};
function pagina(h){h=(h||"").slice(1);return PAG.some(function(x){return x[0]==h})?h:"panoramica"}
st0.p=pagina(location.hash);
var G=["dom","lun","mar","mer","gio","ven","sab"],M=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
function it(x,d){return x.toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d})}
function gg(s){var p=s.split("-");return new Date(+p[0],p[1]-1,+p[2])}
function data(s){var d=gg(s);return G[d.getDay()]+" "+d.getDate()+" "+M[d.getMonth()]}
function breve(s){var d=gg(s);return d.getDate()+" "+M[d.getMonth()]}
function num(n){return "#"+("00"+n).slice(-3)}
function mi(t){if(!t)return null;var p=t.split(":");return +p[0]*60+ +p[1]}
function ora(m){m=Math.round(m);return ("0"+Math.floor(m/60)).slice(-2)+":"+("0"+m%60).slice(-2)}
function med(a){a=a.filter(function(x){return typeof x=="number"&&isFinite(x)});return a.length?a.reduce(function(s,x){return s+x},0)/a.length:null}
function seg(v,d,u){if(v==null||!isFinite(v))return "-";var c=v>0?"su":v<0?"giu":"";return '<span class="'+c+'">'+(v>0?"+":"")+it(v,d==null?0:d)+(u==null?"%":u)+"</span>"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function mln(x){return it(x/1e6,2)}
function f(v,d,un){return v!=null?it(v,d)+(un||""):"-"}
function st(v,s,basso){if(v==null)return "";return basso?(v<=s[0]?"ok":v<=s[1]?"att":"ko"):(v>=s[0]?"ok":v>=s[1]?"att":"ko")}
var NOME={ok:"in soglia",att:"attenzione",ko:"fuori soglia","":""};
var app=document.getElementById("app"),tip=document.getElementById("tip"),D=null,LIM=mi(S.uscita);
function leggi(u){return fetch(u,{cache:"no-store"}).then(function(r){return r.ok?r.json():[]}).catch(function(){return []})}
Promise.all([leggi("registro.json"),leggi("taratura.json")]).then(function(r){
  if(!r[0]||!r[0].length){app.innerHTML='<div class="vuoto">Nessuna edizione registrata. La prima riga arriva con la prossima uscita.</div>';return}
  prepara(r[0],r[1]||[]);disegna()});
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-k]");if(!b||!D||b.disabled)return;var k=b.getAttribute("data-k"),v=b.getAttribute("data-v"),m=b.getAttribute("data-mq");
  if(k=="per")st0.per=+v;else st0[k]=v;if(m)st0.mq=m;if(k=="p"){history.replaceState(null,"","#"+v);scrollTo(0,0)}disegna()});
addEventListener("hashchange",function(){var p=pagina(location.hash);if(D&&p!=st0.p){st0.p=p;disegna()}});
var rt;addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){if(D)disegna()},200)});

function prepara(reg,tar){
  tar=tar.filter(function(x){return x.durata_min>0&&x.punti>0});
  var piano=tar.some(function(x){return x.piano==RIF})?RIF:(tar.length?tar[tar.length-1].piano:null),tt=tar.filter(function(x){return x.piano==piano});
  var tasso=tt.length?tt.reduce(function(s,x){return s+x.punti},0)/tt.reduce(function(s,x){return s+x.durata_min},0):null;
  var mis=reg.filter(function(x){return x.pesati>0&&x.durata_min>0});
  var tokMin=mis.length?mis.reduce(function(s,x){return s+x.pesati},0)/mis.reduce(function(s,x){return s+x.durata_min},0):null,tokPunto=tasso&&tokMin?tokMin/tasso:null;
  reg.forEach(function(x){x.pt=!tasso?null:x.pesati>0&&tokPunto?x.pesati/tokPunto:(x.durata_min!=null?x.durata_min*tasso:null);x.fine=mi(x.ora);x.inizio=mi(x.avvio);x.tardi=x.fine!=null&&x.fine>LIM;x.v=x.v||"?"});
  var vers=[];reg.forEach(function(x){var l=vers[vers.length-1];if(!l||l.v!=x.v){l={v:x.v,r:[]};vers.push(l)}l.r.push(x)});
  vers.forEach(function(g){function su(fn){return med(g.r.map(fn))}g.n=g.r.length;g.dur=su(function(x){return x.durata_min});g.pt=su(function(x){return x.pt});g.tok=su(function(x){return x.pesati>0?x.pesati:null});
    g.fr=su(function(x){return x.fr});g.lunghe=su(function(x){return x.lunghe});g.prim=su(function(x){return x.prim});g.schede=su(function(x){return x.schede});g.fine=su(function(x){return x.tardi?null:x.fine});
    g.punt=g.r.filter(function(x){return !x.tardi}).length/g.n*100;g.kb=g.r[g.n-1].avvio_kb;g.dal=g.r[0].d;g.al=g.r[g.n-1].d});
  D={reg:reg,tar:tar,piano:piano,tasso:tasso,vers:vers,
     tmin:tt.length?Math.min.apply(null,tt.map(function(x){return x.punti/x.durata_min})):null,tmax:tt.length?Math.max.apply(null,tt.map(function(x){return x.punti/x.durata_min})):null}}

/* pezzi comuni dei grafici */
function assi(W,H,L,R,T,B,min,max,da,passo,fmt){var g="";for(var t=da;t<=max+1e-9;t+=passo){var y=T+(H-T-B)*(1-(t-min)/(max-min));g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+fmt(t)+"</text>"}return g}
function cambi(F,L,pw,T,H,B){var g="";F.forEach(function(x,i){if(i==0||F[i-1].v!=x.v){var x0=L+pw*i;if(i>0)g+='<line x1="'+x0+'" x2="'+x0+'" y1="'+(T-14)+'" y2="'+(H-B)+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>';g+='<text x="'+(x0+3)+'" y="'+(T-6)+'" style="fill:var(--ink)">'+esc(x.v)+"</text>"}});return g}
function date(F,L,pw,H,W){var ogni=Math.ceil(F.length/(W<520?4:10)),g="";F.forEach(function(x,i){if(i%ogni==0)g+='<text x="'+(L+pw*i+pw/2)+'" y="'+(H-7)+'" text-anchor="middle">'+breve(x.d)+"</text>"});return g}
function colonna(cx,bw,y0,y1,cls){var r=Math.max(0,Math.min(3,bw/2,Math.abs(y0-y1)/2));return '<path class="col'+(cls?" "+cls:"")+'" d="M'+(cx-bw/2)+" "+y0+"V"+(y1+r)+"q0 -"+r+" "+r+" -"+r+"H"+(cx+bw/2-r)+"q"+r+" 0 "+r+" "+r+"V"+y0+'z"/>'}
function hit(cx,pw,T,h,t){return '<rect class="hit" tabindex="0" x="'+(cx-pw/2)+'" y="'+T+'" width="'+pw+'" height="'+h+'" data-t="'+esc(t)+'"/>'}
function chi(x){return "<b>"+num(x.n)+" "+data(x.d)+"</b> · "+esc(x.v)+"<br>"}
function svg(W,H,g,et){return '<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+et+' I valori sono nella vista Edizioni.">'+g+"</svg>"}

function gOrario(F,W,H){var L=42,R=6,T=22,B=24,pw=(W-L-R)/F.length,bw=Math.min(40,Math.max(4,pw-3)),y0=535,y1=615;function yy(m){return T+(H-T-B)*(1-(Math.min(Math.max(m,y0),y1)-y0)/(y1-y0))}
  var g=assi(W,H,L,R,T,B,y0,y1,540,15,ora)+cambi(F,L,pw,T,H,B)+'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy(LIM)+'" y2="'+yy(LIM)+'" stroke="var(--ink)" stroke-width="1.5"/>';
  F.forEach(function(x,i){var cx=L+pw*i+pw/2;g+=hit(cx,pw,T,H-T-B,chi(x)+(x.avvio?"avvio "+x.avvio+" · ":"")+"uscita "+(x.ora||"?")+(x.durata_min!=null?" · "+x.durata_min+" min":" · rifatta a mano"));
    if(x.fine==null)return;
    if(x.fine>y1)g+='<path class="col tardi" d="M'+(cx-5)+" "+(T+9)+"L"+cx+" "+T+"L"+(cx+5)+" "+(T+9)+'z"/><text x="'+cx+'" y="'+(T+21)+'" text-anchor="middle" style="fill:var(--down)">'+x.ora+"</text>";
    else if(x.inizio!=null)g+=colonna(cx,bw,yy(x.inizio),yy(x.fine),x.tardi?"tardi":"");
    else g+='<rect class="col'+(x.tardi?" tardi":"")+'" x="'+(cx-bw/2)+'" y="'+(yy(x.fine)-1.5)+'" width="'+bw+'" height="3" rx="1.5"/>'});
  return svg(W,H,g+date(F,L,pw,H,W),"Avvio e uscita di ogni edizione rispetto all'obiettivo.")}
function gColonne(F,W,H,un){var L=42,R=6,T=22,B=24,pw=(W-L-R)/F.length,bw=Math.min(40,Math.max(4,pw-3));
  function val(x){return un=="tok"?(x.pesati>0?x.pesati/1e6:null):un=="min"?x.durata_min:x.pt}
  var mx=Math.max.apply(null,F.map(function(x){return val(x)||0}))||1,passo=mx>60?20:mx>30?10:mx>12?5:mx>6?2:mx>3?1:mx>1.2?0.5:0.2,top=Math.ceil(mx*1.08/passo)*passo;
  var g='<defs><pattern id="trat" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="5" fill="var(--mark)"/></pattern></defs>'+assi(W,H,L,R,T,B,0,top,0,passo,function(t){return it(t,passo<1?1:0)})+cambi(F,L,pw,T,H,B);
  F.forEach(function(x,i){var cx=L+pw*i+pw/2,v=val(x);g+=hit(cx,pw,T,H-T-B,chi(x)+(x.pt!=null?"≈ "+it(x.pt,1)+" punti "+esc(D.piano)+"<br>":"")+(x.pesati>0?mln(x.pesati)+" mln di token, misurati · "+x.richieste+" passi":(x.durata_min!=null?"stima dalla durata: "+x.durata_min+" min":"durata non nota")));
    if(v!=null)g+=colonna(cx,bw,H-B,T+(H-T-B)*(1-v/top),un=="min"||x.pesati>0?"":"stima");else g+='<text x="'+cx+'" y="'+(H-B-5)+'" text-anchor="middle">·</text>'});
  return svg(W,H,g+'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" stroke="var(--ink)"/>'+date(F,L,pw,H,W),"Consumo di ogni edizione.")}
function gLinea(F,W,H,campo){var m=MQ[campo],sog=m[1],basso=m[2],un=m[3],dec=m[4],L=42,R=10,T=22,B=24,ok=F.map(function(x){return x[campo]}).filter(function(x){return typeof x=="number"});if(!ok.length)return '<div class="vuoto">Nessun dato.</div>';
  var mn=Math.min.apply(null,ok.concat([sog[0]])),mx=Math.max.apply(null,ok.concat([sog[0]])),pad=(mx-mn)*0.12||1;mn=Math.max(0,mn-pad);mx+=pad;var pw=(W-L-R)/F.length;
  function X(i){return L+pw*i+pw/2}function Y(z){return T+(H-T-B)*(1-(z-mn)/(mx-mn))}
  var passo=(mx-mn)>40?10:(mx-mn)>16?5:(mx-mn)>6?2:1,g=assi(W,H,L,R,T,B,mn,mx,Math.ceil(mn/passo)*passo,passo,function(t){return it(t,0)+un});
