<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pannello di controllo - Gommberg Terminal Daily</title>
<meta name="theme-color" content="#0E0E0E">
<link rel="icon" href="../assets/icona.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,600..900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ===== Pannello di controllo del Gommberg =====
   Una pagina sola, nessuna libreria: legge registro.json e taratura.json (stessa cartella) e, se c'è, ../edizioni.json
   per titolo e link delle edizioni. Le soglie e le misure si cambiano in testa allo script (S e MISURE). */
:root{
  --canvas:#F2F0EC;--card:#FFFFFF;--line:#E3DFD8;--grid:#ECE8E2;--hover:#F7F5F2;
  --ink:#1A1917;--ink2:#4F4A44;--muted:#6B645C;
  --accent:#D9560B;--accent-wash:rgba(217,86,11,.10);--deemph:#D3CCC2;
  --good:#157A3E;--warn:#8F5C00;--bad:#C0271D;--oink:#B84A0C;
  --good-bg:#E6F2EA;--warn-bg:#FAF0DA;--bad-bg:#FAE5E2;
  --mark:#8E877E;--mark2:#C9C2B8;--mark3:#5E5852;
  --side:#0E0E0E;--side-ink:#F5F3EF;--side-muted:#9A938A;--side-hover:#1C1A18;--side-line:#262422;
  --shadow:0 1px 2px rgba(30,22,12,.06),0 2px 6px rgba(30,22,12,.04);
  --display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --canvas:#181716;--card:#22211F;--line:#33302D;--grid:#2C2A27;--hover:#2A2826;
  --ink:#EDEAE5;--ink2:#C9C3BB;--muted:#9C958D;
  --accent:#E8691E;--accent-wash:rgba(232,105,30,.16);--deemph:#4A4641;
  --good:#4CC27A;--warn:#EBB24D;--bad:#FF6B5E;--oink:#FF9A5C;
  --good-bg:rgba(76,194,122,.13);--warn-bg:rgba(224,169,59,.14);--bad-bg:rgba(255,107,94,.14);
  --mark:#837C74;--mark2:#4F4A45;--mark3:#ADA69D;
  --side:#0A0A0A;--side-hover:#181614;--side-line:#24211F;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- impianto: barra laterale + area di lavoro ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--side) 232px,transparent 232px)}
.side{background:var(--side);border-right:1px solid var(--side-line);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;text-decoration:none;color:inherit;border-bottom:1px solid var(--side-line);margin-bottom:12px}
.brand img{width:34px;height:34px;border-radius:7px;display:block}
.brand b{display:block;font-family:var(--display);font-stretch:80%;font-weight:900;font-size:17px;letter-spacing:.01em;line-height:1;color:#F26B1D}
.brand span{display:block;font-size:12px;color:var(--side-muted);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;border-radius:7px;padding:9px 10px;color:#CFC9C1;font-size:14px;font-weight:500;cursor:pointer;text-align:left;position:relative}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav button:hover{background:var(--side-hover);color:var(--side-ink)}
.nav button[aria-current=page]{background:var(--side-hover);color:#fff}
.nav button[aria-current=page]::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:#F26B1D}
.nav button[aria-current=page] svg{opacity:1;stroke:#F26B1D}
.nav .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;background:#C0271D;color:#fff}
.nav .badge.att{background:#8A5700}
.side-foot{margin-top:auto;border-top:1px solid var(--side-line);padding:12px 8px 0;display:grid;gap:10px;font-size:12.5px;color:var(--side-muted)}
.side-foot .ult b{color:var(--side-ink);font-weight:600}
.side-foot .ult a{color:var(--side-ink)}
.lnk{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;min-height:28px;color:#CFC9C1;cursor:pointer;text-decoration:none;font-size:13px}
.lnk:hover{color:#fff}
.lnk svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.work{min-width:0;padding:22px 28px 40px}
.work>.head,.work>#app{max-width:1600px;margin-inline:auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 24px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-family:var(--display);font-stretch:82%;font-weight:800;font-size:30px;line-height:1.05;margin:0;letter-spacing:-.005em}
.head p{margin:5px 0 0;color:var(--muted);font-size:13.5px}
.slicers{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--card)}
.seg button:disabled{opacity:.4;cursor:default}
.seg button:disabled[aria-pressed=true]{background:none;color:var(--ink2)}
.slab{font-size:12px;color:var(--muted);margin-right:-4px}
.dd{position:relative}
.dd select{appearance:none;-webkit-appearance:none;font:500 13px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 30px 6px 11px;box-shadow:var(--shadow);cursor:pointer}
.dd::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}

/* ---------- griglie e card ---------- */
.row{display:grid;gap:14px;margin-bottom:14px}
.r5{grid-template-columns:repeat(5,minmax(0,1fr))}
.r4{grid-template-columns:repeat(4,minmax(0,1fr))}
.r21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.r11{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.stack{display:grid;gap:14px;align-content:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0}
.card>.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px 0}
.ch h2{margin:0;font-size:14px;font-weight:600;line-height:1.3}
.ch .sub{display:block;font-size:12.5px;font-weight:400;color:var(--muted);margin-top:2px}
.ch .tools{display:flex;align-items:center;gap:8px;flex:none}
.card>.cb{padding:10px 16px 14px}
.card>.cb.flush{padding:8px 0 0}
.info{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none;padding:0}
.info:hover{color:var(--ink);border-color:var(--muted)}
.info svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);padding:0 16px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--mark)}
.leg i.acc{background:var(--accent)}.leg i.bad{background:var(--bad)}
.leg i.dot{border-radius:50%}
.leg i.est{background:repeating-linear-gradient(135deg,var(--mark) 0 1.5px,transparent 1.5px 4px);box-shadow:inset 0 0 0 1.2px var(--mark)}
.leg i.line{height:2px;width:14px;border-radius:1px;vertical-align:3px;background:var(--ink)}
.leg i.dash{height:0;width:14px;border-radius:0;vertical-align:3px;background:none;border-top:2px dashed var(--ink2)}

/* ---------- KPI ---------- */
.kpi{display:flex;flex-direction:column;gap:2px;padding:14px 16px 12px;text-align:left;border:1px solid var(--line);width:100%;cursor:pointer;position:relative;overflow:hidden}
.kpi:hover{border-color:var(--deemph)}
.kpi.fermo{cursor:default}.kpi.fermo:hover{border-color:var(--line)}
.kpi .kl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink2);min-width:0}
.kpi .kn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none}
.si svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.si.ok{color:var(--good);background:var(--good-bg)}.si.att{color:var(--warn);background:var(--warn-bg)}.si.ko{color:var(--bad);background:var(--bad-bg)}
.kpi .kv{font-size:30px;font-weight:600;line-height:1.15;letter-spacing:-.015em;margin-top:6px;white-space:nowrap}
.kpi .kv small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:3px}
.kpi .kd{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap;min-height:19px}
.kpi .ks{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .spark{margin-top:8px;height:34px}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.kpi.ok::after{background:var(--good)}.kpi.att::after{background:var(--warn)}.kpi.ko::after{background:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 7px 2px 5px;border-radius:20px;white-space:nowrap;line-height:1.3}
.chip svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip.ok{color:var(--good);background:var(--good-bg)}.chip.att{color:var(--warn);background:var(--warn-bg)}.chip.ko{color:var(--bad);background:var(--bad-bg)}
.chip.neu{color:var(--muted);background:var(--hover)}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:600}
.delta.good{color:var(--good)}.delta.bad{color:var(--bad)}.delta.flat{color:var(--muted)}
.delta svg{width:9px;height:9px;fill:var(--muted)}

/* ---------- grafici ---------- */
svg.ch{display:block;width:100%;height:auto;overflow:visible}
.ax text,.lbl{font-family:var(--body);font-size:11.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.ax line{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.ax .base{stroke:var(--line)}
.band{fill:var(--ink);opacity:.028}
.bandl{font-family:var(--body);font-size:11px;font-weight:600;fill:var(--ink2)}
.brl{stroke:var(--deemph);stroke-width:1.2}
.m{fill:var(--mark)}.m.last{fill:var(--accent)}.m.bad{fill:var(--bad)}
.m.est{fill:url(#hatch);stroke:var(--mark);stroke-width:1.2}.m.est.last{stroke:var(--accent)}
.ln{fill:none;stroke:var(--mark);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.vchg{stroke:var(--mark2);stroke-width:1;stroke-dasharray:3 3}
.nd{font-family:var(--body);font-size:10.5px;fill:var(--muted)}
.area{fill:var(--accent-wash)}
.dot{fill:var(--mark);stroke:var(--card);stroke-width:2}
.dot.bad{fill:var(--bad)}.dot.last{fill:var(--accent)}.dot.bad.last{fill:var(--bad)}
.thr{stroke:var(--ink2);stroke-width:1.2;stroke-dasharray:4 3}
.tgt{stroke:var(--ink);stroke-width:1.5}
.zone{fill:var(--good);opacity:.07}
.mean{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:2 3}
.hit{fill:transparent;cursor:pointer}
.hit:hover{fill:var(--ink);fill-opacity:.045}
.hit:focus{outline:none}.hit:focus-visible{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:2}
.vl{font-family:var(--body);font-size:11.5px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.vl.bad{fill:var(--bad)}
.brk{stroke:var(--card);stroke-width:2.2;fill:none}

/* ---------- liste "da guardare" ---------- */
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.alerts li button{display:flex;gap:10px;align-items:flex-start;width:100%;background:none;border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;text-align:left}
.alerts li button:hover{background:var(--hover)}
.alerts .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.alerts .ic svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.alerts .ok .ic{color:var(--good);background:var(--good-bg)}.alerts .att .ic{color:var(--warn);background:var(--warn-bg)}.alerts .ko .ic{color:var(--bad);background:var(--bad-bg)}
.alerts b{display:block;font-size:13.5px;font-weight:600}
.alerts span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.sect{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin:16px 0 8px}
.cmp{display:grid;gap:2px}
.cmp>div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--grid);font-size:13px}
.cmp>div:last-child{border-bottom:0}
.cmp em{font-style:normal;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}

/* ---------- tabelle ---------- */
.tw{overflow:auto;max-width:100%;background:linear-gradient(to left,var(--card) 40%,rgba(0,0,0,0)) right/36px 100% no-repeat local,radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.16),rgba(0,0,0,0)) right/12px 100% no-repeat scroll}
.tw.tall{max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
th{font-size:12px;font-weight:600;color:var(--ink2);background:var(--card);position:sticky;top:0;z-index:1;border-bottom:1px solid var(--line);vertical-align:bottom}
thead tr.grp th{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-bottom:0;padding-bottom:0;text-align:center}
thead tr.grp th span{display:block;border-bottom:2px solid var(--grid);padding-bottom:5px}
thead tr.grp+tr th{top:22px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:2}
th:first-child{z-index:3}
td{font-variant-numeric:tabular-nums;color:var(--ink)}
th.so{cursor:pointer;user-select:none}
th.so:hover{color:var(--ink)}
th.so[aria-sort]::after{content:"";display:inline-block;margin-left:5px;border:4px solid transparent;vertical-align:1px}
th.so[aria-sort=descending]::after{border-top-color:currentColor;border-bottom-width:0}
th.so[aria-sort=ascending]::after{border-bottom-color:currentColor;border-top-width:0;vertical-align:3px}
tbody tr.cl{cursor:pointer}
tbody tr.cl:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
tbody tr.cl:focus-visible td{background:var(--hover)}
tbody tr.cl:hover td{background:var(--hover)}
tbody tr.on td{background:var(--accent-wash)}
td.c{position:relative}
td.c span{display:inline-block;padding:1px 0}
td.att span{color:var(--warn);font-weight:600}td.ko span{color:var(--bad);font-weight:600}
td.att span::before,td.ko span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
td .e{font-weight:600}td .dt{color:var(--muted);margin-left:6px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;background:var(--hover);color:var(--ink2);border:1px solid var(--line)}
.tag.m{background:var(--accent-wash);border-color:transparent;color:var(--oink)}
td.na{color:var(--muted)}

/* ---------- meter e barra segmentata ---------- */
.big{font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.big small{font-size:15px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
.meter{position:relative;height:12px;border-radius:6px;background:var(--grid);margin:12px 0 6px;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent)}
.meter u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.meter u.w{background:var(--bad)}
.mlab{position:relative;height:16px;font-size:11.5px;color:var(--muted)}
.mlab span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.mlab span:first-child{transform:none}.mlab span:last-child{transform:translateX(-100%)}
.note{font-size:13px;color:var(--ink2);margin:10px 0 0}
.segbar{display:flex;gap:2px;height:28px;margin:10px 0 8px}
.segbar div{border-radius:4px;display:flex;align-items:center;padding-left:7px;font-size:12px;font-weight:600;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.seglist{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:12.5px}
.seglist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:baseline}
.seglist i{width:10px;height:10px;border-radius:3px;display:inline-block;align-self:center}
.seglist em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- multipli (Qualità) ---------- */
.mgrid{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:14px;margin-bottom:18px}
@media (max-width:900px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mc{display:flex;flex-direction:column;width:100%;text-align:left;cursor:pointer;padding:0;border:1px solid var(--line)}
.mc .mg{margin-top:auto}
.mc:hover{border-color:var(--deemph)}
.mc[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent),var(--shadow)}
.mc .mt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:12px 14px 0;font-size:13px;font-weight:500;color:var(--ink2);min-height:32px}
.mc .mv{display:flex;align-items:baseline;gap:8px;padding:2px 14px 0;flex-wrap:wrap}
.mc .mv b{font-size:24px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.mc .mv .sx{font-size:12px;color:var(--muted)}
.mc .mv .delta{font-size:12.5px}
.mc .mg{padding:4px 8px 8px}
.h3{font-size:13px;font-weight:600;color:var(--ink2);margin:6px 0 10px;display:flex;align-items:baseline;gap:10px}
.h3 span{font-weight:400;color:var(--muted);font-size:12.5px}

/* ---------- pannelli laterali (edizione, metodo) ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,8,6,.32);opacity:0;pointer-events:none;transition:opacity .16s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--card);border-left:1px solid var(--line);z-index:21;transform:translateX(102%);visibility:hidden;transition:transform .2s ease,visibility 0s linear .2s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
.drawer.on{transform:none;visibility:visible;transition:transform .2s ease}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-family:var(--display);font-stretch:85%;font-weight:800;font-size:22px;line-height:1.1}
.dh p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.dh .x{display:flex;gap:4px}
.ib{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink2)}
.ib:hover{background:var(--hover);color:var(--ink)}

.dl>span:nth-child(3n+2){text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

<noscript><p style="padding:20px">Il pannello ha bisogno di JavaScript.</p></noscript>
<script>
(function(){
"use strict";
/* ============ Impostazioni ============
   S: soglie. Per ogni misura [verde fino a, rosso oltre] (o "sotto" se conta di più alto).
   RIF: il piano a cui si rapporta il consumo. */
var RIF="Pro";
var S={uscita:"09:45",punt:[90,75],consumo:[25,35],fr:[18,21],lunghe:[10,15],prim:[40,25],schede:[25,18]};
/* MISURE di Qualità: campo di registro.json, nome, gruppo, soglia (o null), meglio se bassa, unità, decimali, riferimento senza
   semaforo, spiegazione. Una misura compare solo se nei dati c'è almeno un valore: per aggiungerne una (per esempio quelle di
   G-02) basta che pannello.py scriva il campo e che qui ci sia la riga. */
var MISURE=[
  {k:"fr",n:"Parole per frase",g:"Scrittura",s:S.fr,basso:1,u:"",d:1,i:"Media delle parole per frase nei testi. Più è bassa, più la lettura è scorrevole."},
  {k:"lunghe",n:"Frasi oltre 30 parole",g:"Scrittura",s:S.lunghe,basso:1,u:"%",d:0,i:"Quota delle frasi più lunghe di 30 parole."},
  {k:"gergo",n:"Gergo ogni 1.000 parole",g:"Scrittura",s:null,basso:1,u:"",d:1,i:"Termini da addetti ogni 1.000 parole. È un termometro, non una regola: nessuna soglia."},
  {k:"prim",n:"Fonti primarie",g:"Fonti e ricerca",s:S.prim,basso:0,u:"%",d:0,i:"Quota delle schede dei fatti con una fonte primaria (chi ha prodotto il dato o la notizia)."},
  {k:"l1",n:"Fonti di livello 1",g:"Fonti e ricerca",s:null,basso:0,u:"%",d:0,i:"Quota delle schede con almeno una fonte di livello 1 secondo fonti.json."},
  {k:"schede",n:"Schede dei fatti",g:"Fonti e ricerca",s:S.schede,basso:0,u:"",d:0,i:"Fatti verificati e registrati dalla redazione per l'edizione."},
  {k:"ricerche",n:"Ricerche",g:"Fonti e ricerca",s:null,ref:25,refn:"riferimento #026",basso:0,u:"",d:0,i:"Ricerche distinte fatte dalla redazione. Il riferimento è la #026 (25-30 ricerche), il benchmark scelto per G-34."},
  {k:"fonti",n:"Pagine citate",g:"Fonti e ricerca",s:null,basso:0,u:"",d:0,i:"Pagine distinte citate nelle schede dei fatti."},
  {k:"aperte",n:"Pagine consultate",g:"Fonti e ricerca",s:null,basso:0,u:"",d:0,i:"Pagine diverse che la redazione ha aperto davvero, anche quelle poi non citate (dalla trascrizione della sessione, G-02)."},
  {k:"fallite",n:"Pagine non raggiunte",tab:1,nb:"Non raggiunte",g:"Fonti e ricerca",s:null,basso:1,u:"",d:0,i:"Pagine che la redazione ha provato ad aprire senza riuscirci (G-02)."},
  {k:"fonte_singola",n:"Fatti a fonte singola",tab:1,nb:"Fonte singola",g:"Fonti e ricerca",s:null,basso:1,u:"",d:0,i:"Fatti che poggiano su un solo autore, senza fonte primaria. Un'agenzia conta una volta sola, anche se ripresa da più siti. Traguardo: zero o quasi."},
  {k:"autori",n:"Autori per analisi",g:"Fonti e ricerca",s:null,ref:3,refn:"traguardo 3-4",basso:0,u:"",d:1,i:"Autori diversi dietro ogni analisi, in media: chi ha scritto le schede su cui poggia la tesi."}
];
var PAG=[
  {id:"panoramica",n:"Panoramica",ic:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>'},
  {id:"puntualita",n:"Puntualità",ic:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'},
  {id:"consumo",n:"Consumo",ic:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'},
  {id:"qualita",n:"Qualità",ic:'<path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/>'},
  {id:"edizioni",n:"Edizioni",ic:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>'}
];
var ALIAS={operativita:"puntualita",versioni:"edizioni",metodo:"panoramica"};

/* ============ Formati ============ */
var G=["dom","lun","mar","mer","gio","ven","sab"],M=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
function it(x,d){return x.toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d})}
function gg(s){var p=s.split("-");return new Date(+p[0],p[1]-1,+p[2])}
function data(s){var d=gg(s);return G[d.getDay()]+" "+d.getDate()+" "+M[d.getMonth()]}
function breve(s){var d=gg(s);return d.getDate()+" "+M[d.getMonth()]}
function num(n){return "#"+("00"+n).slice(-3)}
function mi(t){if(!t)return null;var p=t.split(":");return +p[0]*60+ +p[1]}
function ora(m){m=Math.round(m);return ("0"+Math.floor(m/60)).slice(-2)+":"+("0"+m%60).slice(-2)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function isn(x){return typeof x=="number"&&isFinite(x)}
function med(a){a=a.filter(isn);return a.length?a.reduce(function(s,x){return s+x},0)/a.length:null}
function mediana(a){a=a.filter(isn).sort(function(x,y){return x-y});if(!a.length)return null;var h=a.length>>1;return a.length%2?a[h]:(a[h-1]+a[h])/2}
function fv(v,d,u){return isn(v)?it(v,d)+(u||""):"-"}
function mln(x){return it(x/1e6,2)}
function st(v,s,basso){if(!isn(v)||!s)return "";return basso?(v<=s[0]?"ok":v<=s[1]?"att":"ko"):(v>=s[0]?"ok":v>=s[1]?"att":"ko")}
var NOME={ok:"In soglia",att:"Attenzione",ko:"Fuori soglia"};
var IC={ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',att:'<path d="M12 7v6M12 17h.01"/>',ko:'<path d="M7 7l10 10M17 7L7 17"/>'};
function chip(s,txt){if(!s)return "";return '<span class="chip '+s+'"><svg viewBox="0 0 24 24">'+IC[s]+"</svg>"+(txt||NOME[s])+"</span>"}
function stato(s){if(!s)return "";return '<span class="si '+s+'" title="'+NOME[s]+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+IC[s]+'</svg><span class="sr">'+NOME[s]+"</span></span>"}
function senzaDur(F){var k=F.filter(function(x){return !isn(x.durata_min)}).length;return k?k+" "+plur(k,"rifatta","rifatte")+" a mano, esclus"+plur(k,"a","e"):"dall'avvio all'uscita"}
/* Quote intere che sommano 100 (resti più grandi) */
function cento(v){var t=v.map(Math.floor),r=100-t.reduce(function(a,b){return a+b},0),o=v.map(function(x,i){return [x-Math.floor(x),i]}).sort(function(a,b){return b[0]-a[0]});for(var i=0;i<r&&i<o.length;i++)t[o[i][1]]++;return t}
function plur(n,a,b){return n==1?a:b}

/* ============ Stato ============ */
var D=null,ED={},app=document.getElementById("app"),tip=document.getElementById("tip"),LIM=mi(S.uscita);
var st0={p:"panoramica",per:10,v:"",un:"pt",mq:"",ev:"ed",sort:{k:"n",dir:-1},sortv:{k:"v",dir:-1},sel:null};
function leggiHash(){var h=(location.hash||"").slice(1).toLowerCase();var met=h=="metodo";if(h=="versioni")st0.ev="ve";h=ALIAS[h]||h;st0.p=PAG.some(function(p){return p.id==h})?h:"panoramica";return met}
var apriMetodo=leggiHash();
function leggi(u){return fetch(u,{cache:"no-store"}).then(function(r){return r.ok?r.json():[]}).catch(function(){return []})}
Promise.all([leggi("registro.json"),leggi("taratura.json"),leggi("../edizioni.json")]).then(function(r){
  (Array.isArray(r[2])?r[2]:[]).forEach(function(e){if(e&&e.numero)ED[e.numero]=e});
  if(!Array.isArray(r[0])||!r[0].length){document.getElementById("sottotitolo").textContent="";app.innerHTML='<div class="card vuoto">Nessuna edizione registrata. La prima riga arriva con la prossima uscita.</div>';return}
  prepara(r[0],Array.isArray(r[1])?r[1]:[]);disegna();if(apriMetodo)metodo()});

/* ============ Dati ============ */
function prepara(reg,tar){
  reg=reg.filter(function(x){return x&&x.n&&x.d}).sort(function(a,b){return a.n-b.n});
  tar=tar.filter(function(x){return x.durata_min>0&&x.punti>0});
  var piano=tar.some(function(x){return x.piano==RIF})?RIF:(tar.length?tar[tar.length-1].piano:null),tt=tar.filter(function(x){return x.piano==piano});
  var tasso=tt.length?tt.reduce(function(s,x){return s+x.punti},0)/tt.reduce(function(s,x){return s+x.durata_min},0):null;
  var mis=reg.filter(function(x){return x.pesati>0&&x.durata_min>0});
  var tokMin=mis.length?mis.reduce(function(s,x){return s+x.pesati},0)/mis.reduce(function(s,x){return s+x.durata_min},0):null,tokPunto=tasso&&tokMin?tokMin/tasso:null;
  reg.forEach(function(x){
    x.misurata=x.pesati>0;
    x.pt=!tasso?null:x.misurata&&tokPunto?x.pesati/tokPunto:(isn(x.durata_min)?x.durata_min*tasso:null);
    x.fine=mi(x.ora);x.inizio=mi(x.avvio);x.tardi=x.fine!=null&&x.fine>LIM;x.v=x.v||"?";
    x.tok=x.misurata?x.pesati:null});
  var vers=[];reg.forEach(function(x){var l=vers[vers.length-1];if(!l||l.v!=x.v){l={v:x.v,r:[]};vers.push(l)}l.r.push(x)});
  vers.forEach(function(g){var s=riassunto(g.r);for(var k in s)g[k]=s[k];g.dal=g.r[0].d;g.al=g.r[g.r.length-1].d;g.kb=g.r[g.r.length-1].avvio_kb});
  D={reg:reg,tar:tar,piano:piano,tasso:tasso,vers:vers,
     tmin:tt.length?Math.min.apply(null,tt.map(function(x){return x.punti/x.durata_min})):null,
     tmax:tt.length?Math.max.apply(null,tt.map(function(x){return x.punti/x.durata_min})):null};
  MISURE=MISURE.filter(function(m){return reg.some(function(x){return isn(x[m.k])})});
}
/* Le misure di un gruppo di edizioni: medie, puntualità, uscita mediana, consumo. */
function riassunto(F){
  var s={n:F.length};
  s.punt=F.length?F.filter(function(x){return !x.tardi}).length/F.length*100:null;
  s.tardi=F.filter(function(x){return x.tardi});
  s.uscMed=mediana(F.map(function(x){return x.fine}));
  s.dur=med(F.map(function(x){return x.durata_min}));
  s.pt=med(F.map(function(x){return x.pt}));
  s.sett=isn(s.pt)?s.pt*5:null;
  s.tok=med(F.map(function(x){return x.tok}));
  s.nmis=F.filter(function(x){return x.misurata}).length;
  MISURE.concat([{k:"parole"}]).forEach(function(m){s[m.k]=med(F.map(function(x){return x[m.k]}))});
  return s}
/* La versione precedente con almeno 3 edizioni (una versione da 1-2 edizioni non fa da confronto). */
function prec(gi){for(var q=gi-1;q>=0;q--)if(D.vers[q].r.length>=3)return D.vers[q];return null}
/* Il periodo scelto e il confronto: con "tutte le versioni" il confronto sono le edizioni subito prima, con una versione la versione prima. */
function finestra(){
  var all=D.reg,F,P=null,lab="",labS="";
  if(st0.v){
    var gi=-1;D.vers.forEach(function(g,i){if(g.v==st0.v)gi=i});
    F=gi<0?[]:D.vers[gi].r.slice(-st0.per);
    var pv=prec(gi);if(pv){P=pv.r;lab=labS=pv.v}
  }else{
    F=all.slice(-st0.per);var i0=all.length-F.length,pn=Math.min(F.length,i0);
    if(pn>=3){P=all.slice(i0-pn,i0);lab="le "+pn+" precedenti";labS=pn+" prec."}
  }
  return {F:F,P:P,lab:lab,labS:labS,a:riassunto(F),b:P?riassunto(P):null}}

/* ============ Pezzi comuni ============ */
var FRECCIA={su:'<svg viewBox="0 0 10 10"><path d="M5 1.5L9 7.5H1z"/></svg>',giu:'<svg viewBox="0 0 10 10"><path d="M5 8.5L1 2.5h8z"/></svg>'};
/* Variazione: il colore dice meglio o peggio (meglio se bassa = basso), il segno resta sempre scritto. */
function delta(a,b,basso,d,u,soglia){if(!isn(a)||!isn(b))return "";var x=a-b,eps=soglia==null?Math.pow(10,-(d||0))/2:soglia;
  if(Math.abs(x)<eps)return '<span class="delta flat">= invariato</span>';
  var meglio=basso?x<0:x>0;return '<span class="delta '+(meglio?"good":"bad")+'">'+(x>0?FRECCIA.su:FRECCIA.giu)+(x>0?"+":"−")+it(Math.abs(x),d||0)+(u||"")+"</span>"}
function dMin(a,b){if(!isn(a)||!isn(b))return "";var x=Math.round(a-b);if(!x)return '<span class="delta flat">= invariato</span>';return '<span class="delta '+(x<0?"good":"bad")+'">'+(x>0?FRECCIA.su:FRECCIA.giu)+(x>0?"+":"−")+Math.abs(x)+" min</span>"}
function vs(w){return w.lab?'<span>vs '+esc(w.lab)+"</span>":""}

/* ============ Grafici (SVG a mano) ============ */
var W0=0;
function larg(el){return Math.max(260,Math.floor(el?el.getBoundingClientRect().width:600))}
function passo(span,tick){var raw=span/tick,p=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function defs(){return '<defs><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.6" height="4" fill="var(--mark)"/></pattern></defs>'}
function bande(F,L,pw,T,Hp,etichette){var g="",i0=0;for(var i=1;i<=F.length;i++){if(i==F.length||F[i].v!=F[i0].v){var x0=L+pw*i0,w=pw*(i-i0),k=gIdx(F[i0].v);
      if(i0>0)g+='<line class="vchg" x1="'+x0+'" x2="'+x0+'" y1="'+T+'" y2="'+(T+Hp)+'"/>';
      if(etichette&&w>=8){var yb=T+Hp+30;g+='<line class="brl" x1="'+(x0+3)+'" x2="'+(x0+w-3)+'" y1="'+yb+'" y2="'+yb+'"/><line class="brl" x1="'+(x0+3)+'" x2="'+(x0+3)+'" y1="'+(yb-4)+'" y2="'+yb+'"/>';
        if(w>=30)g+='<text class="bandl" x="'+(x0+7)+'" y="'+(yb+13)+'">'+esc(F[i0].v)+"</text>"}i0=i}}return g}
function gIdx(v){for(var i=0;i<D.vers.length;i++)if(D.vers[i].v==v)return D.vers.length-1-i;return 0}
function xlab(F,L,pw,y,W){var min=W<520?54:62,ogni=Math.max(1,Math.ceil(min/pw)),g="",n=F.length;F.forEach(function(x,i){if((n-1-i)%ogni==0){var cx=L+pw*i+pw/2,an=cx+24>W?"end":"middle";g+='<text x="'+(an=="end"?Math.min(W,cx+pw/2):cx)+'" y="'+y+'" text-anchor="'+an+'">'+breve(x.d)+"</text>"}});return '<g class="ax">'+g+"</g>"}
function yax(L,R,W,yf,ticks,fmt){var g="";ticks.forEach(function(t){var y=Math.round(yf(t))+.5;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+fmt(t)+"</text>"});return '<g class="ax">'+g+"</g>"}
function col(cx,bw,y0,y1,cls){var h=Math.abs(y0-y1),r=Math.max(0,Math.min(4,bw/2,h));if(h<.5)return "";var top=Math.min(y0,y1);
  return '<path class="m'+(cls?" "+cls:"")+'" d="M'+(cx-bw/2)+" "+(top+h)+"V"+(top+r)+"q0 -"+r+" "+r+" -"+r+"H"+(cx+bw/2-r)+"q"+r+" 0 "+r+" "+r+"V"+(top+h)+'z"/>'}
function hit(cx,pw,T,h,x,t){return '<rect class="hit" tabindex="'+(x.ultimo?0:-1)+'" role="button" x="'+(cx-pw/2)+'" y="'+T+'" width="'+pw+'" height="'+h+'" data-ed="'+x.n+'" data-t="'+esc(t)+'" aria-label="'+esc(num(x.n)+" "+data(x.d))+'"/>'}
function svg(W,H,g,lab){return '<svg class="ch" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+esc(lab)+' I valori sono anche nella pagina Edizioni.">'+defs()+g+"</svg>"}

/* Avvio-uscita: una barra per edizione dall'avvio all'uscita, l'obiettivo come linea piena. Fuori scala: barra spezzata in alto con l'ora. */
function gOrari(F,W,H){var L=46,R=74,T=26,B=48,Hp=H-T-B,pw=(W-L-R)/F.length,bw=Math.min(24,Math.max(3,pw*.56)),lo=525,hi=615,n=F.length,ultLab=-1e9;
  function Y(m){return T+Hp*(1-(Math.min(Math.max(m,lo),hi)-lo)/(hi-lo))}
  var g=bande(F,L,pw,T,Hp,true)+yax(L,R,W,Y,[540,555,570,585,600,615],ora);
  var yT=Y(LIM);g+='<line class="tgt" x1="'+L+'" x2="'+(W-R)+'" y1="'+yT+'" y2="'+yT+'"/><text class="vl" x="'+(W-R+8)+'" y="'+(yT-3)+'">obiettivo</text><text class="vl" x="'+(W-R+8)+'" y="'+(yT+11)+'">'+S.uscita+"</text>";
  F.forEach(function(x,i){var cx=L+pw*i+pw/2,cls=x.tardi?"bad":i==n-1?"last":"",fuori=x.fine>hi;
    var t=tipEd(x)+(x.avvio?"Avvio "+x.avvio+" · ":"Avvio non registrato · ")+"uscita <b>"+(x.ora||"non registrata")+"</b>"+(isn(x.durata_min)?"<br>"+x.durata_min+" minuti":"")+(x.tardi?'<br><b style="color:#FF8A7E">'+Math.round(x.fine-LIM)+" min oltre l'obiettivo</b>":"");
    g+=hit(cx,pw,T,Hp,x,t);
    if(x.fine==null)return;var y1=Y(x.fine),y0=x.inizio!=null?Y(x.inizio):y1+4;if(y0-y1<4)y0=Math.min(T+Hp,y1+4);
    if(x.inizio==null)g+='<rect class="m '+cls+'" x="'+(cx-bw/2)+'" y="'+(y1-2)+'" width="'+bw+'" height="4" rx="2"/>';
    else g+=col(cx,bw,y0,y1,cls);
    if(fuori){g+='<path class="brk" d="M'+(cx-bw/2-2)+" "+(T+9)+"l"+((bw+4)/2)+" -4l"+((bw+4)/2)+' 4"/>';if(cx-ultLab>=40){g+='<text class="vl bad" x="'+cx+'" y="'+(T-8)+'" text-anchor="middle">'+x.ora+"</text>";ultLab=cx}}
  });
  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+Hp+.5)+'" y2="'+(T+Hp+.5)+'" style="stroke:var(--line)"/>';
  return svg(W,H,g+xlab(F,L,pw,T+Hp+18,W),"Avvio e uscita di ogni edizione rispetto all'obiettivo delle "+S.uscita+".")}

/* Colonne con media: per durata e consumo. o.val(x), o.est(x) stima tratteggiata, o.fmt, o.tip(x). */
function gColonne(F,W,H,o){var L=46,R=74,T=20,B=48,Hp=H-T-B,pw=(W-L-R)/F.length,bw=Math.min(24,Math.max(3,pw*.56)),n=F.length;
  var vals=F.map(o.val).filter(isn),mx=Math.max.apply(null,vals.concat([o.min||0]))||1,ps=passo(mx,4),top=Math.ceil(mx*1.05/ps)*ps;
  function Y(v){return T+Hp*(1-v/top)}var ticks=[];for(var t=0;t<=top+1e-9;t+=ps)ticks.push(t);
  var g=bande(F,L,pw,T,Hp,true)+yax(L,R,W,Y,ticks,function(t){return it(t,ps<1?(ps<.1?2:1):0)});
  F.forEach(function(x,i){var cx=L+pw*i+pw/2,v=o.val(x);g+=hit(cx,pw,T,Hp,x,tipEd(x)+o.tip(x));
    var cls=(o.cls?o.cls(x):"")||(i==n-1?"last":"");if(o.est&&o.est(x))cls="est"+(i==n-1?" last":"");
    if(isn(v))g+=col(cx,bw,T+Hp,Y(v),cls);else if(pw>=16)g+='<text class="nd" x="'+cx+'" y="'+(T+Hp-5)+'" text-anchor="middle">n.d.</text>'});
  var m=med(vals);if(isn(m)&&o.media!==false){var ym=Y(m);g+='<line class="mean" x1="'+L+'" x2="'+(W-R)+'" y1="'+ym+'" y2="'+ym+'"/><text class="vl" x="'+(W-R+8)+'" y="'+(ym-3)+'">media</text><text class="vl" x="'+(W-R+8)+'" y="'+(ym+11)+'">'+o.fmt(m)+"</text>"}
  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+Hp+.5)+'" y2="'+(T+Hp+.5)+'" style="stroke:var(--ink2);stroke-width:1"/>';
  return svg(W,H,g+xlab(F,L,pw,T+Hp+18,W),o.lab)}

/* Linea con soglia e zona buona: per Qualità (piccola o grande). */
function gLinea(F,W,H,m,piccolo){var k=m.k,L=piccolo?8:46,R=piccolo?30:74,T=piccolo?10:22,B=piccolo?8:48,Hp=H-T-B;
  var vals=F.map(function(x){return x[k]}).filter(isn);if(!vals.length)return '<div class="vuoto">Nessun dato nel periodo.</div>';
  var rif=m.s?m.s[0]:m.ref,ext=vals.concat(isn(rif)?[rif]:[]),mn=Math.min.apply(null,ext),mx=Math.max.apply(null,ext),pad=(mx-mn)*.15||Math.max(1,mx*.1);
  mn=Math.max(0,mn-pad);mx=mx+pad;var pw=(W-L-R)/F.length;function X(i){return L+pw*i+pw/2}function Y(v){return T+Hp*(1-(v-mn)/(mx-mn))}
  var g="";if(!piccolo){g+=bande(F,L,pw,T,Hp,true);var ps=passo(mx-mn,4),ticks=[];for(var t=Math.ceil(mn/ps)*ps;t<=mx+1e-9;t+=ps)ticks.push(t);g+=yax(L,R,W,Y,ticks,function(t){return it(t,ps<1?1:0)+m.u})}
  if(m.s){var y0=Y(m.s[0]),yz=m.basso?[y0,T+Hp]:[T,y0];g+='<rect class="zone" x="'+L+'" y="'+Math.min(yz[0],yz[1])+'" width="'+(W-L-R)+'" height="'+Math.abs(yz[1]-yz[0])+'"/>'}
  if(isn(rif)){var yr=Y(rif);g+='<line class="thr" x1="'+L+'" x2="'+(W-R)+'" y1="'+yr+'" y2="'+yr+'"/>';
    if(!piccolo)g+='<text class="vl" x="'+(W-R+8)+'" y="'+(yr-3)+'">'+(m.s?"soglia":"riferim.")+'</text><text class="vl" x="'+(W-R+8)+'" y="'+(yr+11)+'">'+it(rif,0)+m.u+"</text>"}
  var d="",pen=false,last=null;F.forEach(function(x,i){var v=x[k];if(!isn(v))return;d+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);pen=true;last=i});
  g+='<path class="ln" d="'+d+'"'+(piccolo?' style="stroke-width:1.6"':"")+"/>";
  F.forEach(function(x,i){var v=x[k];if(!isn(v))return;var s=st(v,m.s,m.basso),fin=i==last,cls=(s=="ko"||s=="att"?" bad":"")+(fin?" last":""),r=piccolo?(fin?4:2.4):(fin?5:3.5);
    g+='<circle class="dot'+cls+'" cx="'+X(i)+'" cy="'+Y(v)+'" r="'+r+'" style="stroke-width:'+(piccolo?1.5:2)+'"/>';
    if(!piccolo)g+='<rect class="hit" tabindex="'+(fin?0:-1)+'" role="button" x="'+(X(i)-pw/2)+'" y="'+T+'" width="'+pw+'" height="'+Hp+'" data-ed="'+x.n+'" data-t="'+esc(tipEd(x)+m.n+": <b>"+it(v,m.d)+m.u+"</b>"+(s?" · "+NOME[s].toLowerCase():""))+'" aria-label="'+esc(num(x.n)+" "+m.n+" "+it(v,m.d)+m.u)+'"/>'});
  if(piccolo&&last!=null){var lv=F[last][k];g+='<text class="vl" x="'+(X(last)+7)+'" y="'+(Y(lv)+(Y(lv)<T+10?12:-6))+'" text-anchor="start" style="font-size:11px">'+it(lv,m.d)+"</text>"}
  return svg(W,H,g+(piccolo?"":xlab(F,L,pw,T+Hp+18,W)),m.n+" per edizione.")}


/* Striscia delle uscite: un segno per edizione, rosso se dopo l'obiettivo */
function striscia(F){var n=F.length,W=200,H=34,gap=n>40?1:2,w=(W-gap*(n-1))/n,g="";F.forEach(function(x,i){g+='<rect x="'+(i*(w+gap)).toFixed(2)+'" y="'+(x.tardi?6:14)+'" width="'+w.toFixed(2)+'" height="'+(x.tardi?22:14)+'" rx="'+Math.min(2,w/2)+'" fill="var(--'+(x.tardi?"bad":"deemph")+')"/>'});
  return '<svg class="ch" viewBox="0 0 '+W+" "+H+'" preserveAspectRatio="none" aria-hidden="true" style="height:'+H+'px">'+g+"</svg>"}
/* Mini-andamento per le card KPI */
function spark(F,val,W,H,lim,basso){var v=F.map(val),ok=v.filter(isn);if(ok.length<2)return "";var ext=ok.concat(lim!=null?[lim]:[]),mn=Math.min.apply(null,ext),mx=Math.max.apply(null,ext);if(mx==mn){mx+=1;mn-=1}
  var pw=W/(F.length),d="",pen=false,li=-1;function X(i){return pw*i+pw/2}function Y(z){return 3+(H-6)*(1-(z-mn)/(mx-mn))}
  v.forEach(function(z,i){if(!isn(z))return;d+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(z).toFixed(1);pen=true;li=i});
  var g=lim!=null?'<line x1="0" x2="'+W+'" y1="'+Y(lim)+'" y2="'+Y(lim)+'" class="thr" style="stroke-width:1"/>':"";
  g+='<path d="'+d+'" fill="none" stroke="var(--deemph)" stroke-width="1.6" stroke-linejoin="round" style="stroke:var(--muted);opacity:.55"/>';
  if(li>=0)g+='<circle cx="'+X(li)+'" cy="'+Y(v[li])+'" r="3" fill="var(--accent)" stroke="var(--card)" stroke-width="1.5"/>';
  return '<svg class="ch" viewBox="0 0 '+W+" "+H+'" preserveAspectRatio="none" aria-hidden="true" style="height:'+H+'px">'+g+"</svg>"}

/* ============ Disegno ============ */
/* Dopo ogni ridisegno il fuoco torna sul controllo che lo aveva (tastiera e lettori di schermo) */

function chiaveFuoco(el){if(!el||el==document.body||drawer.contains(el))return null;if(el.id)return "#"+el.id;for(var i=0;i<CHIAVI.length;i++){var v=el.getAttribute&&el.getAttribute(CHIAVI[i]);if(v!=null)return el.tagName.toLowerCase()+"["+CHIAVI[i]+'="'+v.replace(/"/g,'\\"')+'"]'}return null}

function disegna0(){
  var w=finestra(),F=w.F,a=w.a,b=w.b,P=D.piano||"Pro";D.reg.forEach(function(x){x.ultimo=false});if(F.length)F[F.length-1].ultimo=true;vsTxt=w.labS?' <span>vs '+esc(w.labS)+"</span>":"";

    return '<button type="button" data-go="'+p.id+'"'+(st0.p==p.id?' aria-current="page"':"")+'><svg viewBox="0 0 24 24">'+p.ic+"</svg>"+p.n+bd+"</button>"}).join("");
  var cur=document.querySelector("#nav [aria-current]");if(cur&&innerWidth<=1100){var sd=document.querySelector(".side"),r=cur.getBoundingClientRect();if(r.right>innerWidth-8||r.left<0)sd.scrollLeft+=r.left-(innerWidth-r.width)/2}
  var u=D.reg[D.reg.length-1];

    +'<label class="dd"><span class="sr">Versione</span><select id="selv" aria-label="Versione delle istruzioni"><option value="">Tutte le versioni</option>'+vv.map(function(g){return '<option value="'+esc(g.v)+'"'+(st0.v==g.v?" selected":"")+">"+esc(g.v)+" · "+g.r.length+" "+plur(g.r.length,"edizione","edizioni")+"</option>"}).join("")+"</select></label>";
  var pag=PAG.filter(function(p){return p.id==st0.p})[0];
  document.getElementById("titolo").textContent=pag.n;document.title=pag.n+" - Pannello di controllo - Gommberg Terminal Daily";
  if(!F.length){document.getElementById("sottotitolo").textContent="Nessuna edizione con questi filtri.";app.innerHTML='<div class="card vuoto">Nessuna edizione con questi filtri.</div>';return}
  document.getElementById("sottotitolo").innerHTML=F.length+" "+plur(F.length,"edizione","edizioni")+(st0.v?" della "+esc(st0.v):"")+" · dal "+breve(F[0].d)+" al "+breve(F[F.length-1].d)+(w.lab?" · confronto con "+esc(w.lab):"");
  var h="";

}
var GR={};

/* --- da guardare: misure fuori soglia, ritardi, consumo --- */
function listaAllarmi(w){var a=w.a,F=w.F,L=[];
  var sp=st(a.punt,S.punt);if(a.tardi.length&&sp!="ok")L.push({s:sp,t:a.tardi.length+" "+plur(a.tardi.length,"uscita","uscite")+" dopo le "+S.uscita,d:a.tardi.slice(-3).map(function(x){return breve(x.d)+" alle "+x.ora}).join(" · "),go:"puntualita"});
  var sc=st(a.sett,S.consumo,1);if(sc&&sc!="ok")L.push({s:sc,t:"Consumo sopra la soglia",d:"≈ "+it(a.sett,0)+" punti "+esc(D.piano||RIF)+" a settimana, soglia "+S.consumo[0],go:"consumo"});
  MISURE.forEach(function(m){if(!m.s)return;var s=st(a[m.k],m.s,m.basso);if(s&&s!="ok"){var ul=F[F.length-1][m.k];
    L.push({s:s,t:m.n+(m.basso?" sopra la soglia":" sotto la soglia"),d:"Media "+fv(a[m.k],m.d,m.u)+", soglia "+it(m.s[0],0)+m.u+(isn(ul)?" · ultima "+fv(ul,m.d,m.u):""),go:"qualita",mq:m.k})}});
  var o={ko:0,att:1};L.sort(function(x,y){return o[x.s]-o[y.s]});return L}

/* ================= PANORAMICA ================= */
function panoramica(w,allarmi){var a=w.a,b=w.b||{},F=w.F,P=D.piano||RIF,u=F[F.length-1];
  var h='<div class="row r5">'
   +kpi({go:"puntualita",l:"Puntualità",s:st(a.punt,S.punt),v:it(a.punt,0)+"%",d:delta(a.punt,b.punt,0,0," pt"),n:(F.length-a.tardi.length)+" su "+F.length+" entro le "+S.uscita,spark:striscia(F)})
   +kpi({go:"puntualita",l:"Uscita mediana",s:isn(a.uscMed)?(a.uscMed<=LIM?"ok":"ko"):"",v:isn(a.uscMed)?ora(a.uscMed):"-",d:dMin(a.uscMed,b.uscMed),n:"obiettivo "+S.uscita+" · ultima "+(u.ora||"-"),spark:spark(F,function(x){return x.fine!=null?Math.min(x.fine,615):null},200,34,LIM)})
   +kpi({go:"consumo",l:"Consumo",s:st(a.sett,S.consumo,1),v:isn(a.sett)?"≈ "+it(a.sett,0):"-",u:"su 100",d:delta(a.sett,b.sett,1,0,""),n:"punti "+esc(P)+" a settimana · soglia "+S.consumo[0],spark:spark(F,function(x){return x.pt},200,34,null)})
   +kpi({go:"qualita",mq:"fr",l:"Parole per frase",s:st(a.fr,S.fr,1),v:fv(a.fr,1),d:delta(a.fr,b.fr,1,1,""),n:"soglia "+S.fr[0]+" · ultima "+fv(u.fr,1),spark:spark(F,function(x){return x.fr},200,34,S.fr[0])})
   +kpi({go:"qualita",mq:"prim",l:"Fonti primarie",s:st(a.prim,S.prim),v:fv(a.prim,0,"%"),d:delta(a.prim,b.prim,0,0," pt"),n:"soglia "+S.prim[0]+"% · ultima "+fv(u.prim,0,"%"),spark:spark(F,function(x){return x.prim},200,34,S.prim[0])})
